}

/* ================================================================ 入库规则（PRD §5.6） */
/* 只放「业务规则」：摘要多长、标签几个、什么情况进待复核。
   「技术规则」不在这 —— 抓取解析 / URL 规范化 / 切段参数改错会让系统直接坏掉。 */
async function renderRules(){
  const box = $('#view-rules');
  box.innerHTML = `<div class="empty">加载中…</div>`;
  let r;
  try { r = await apiGet('/api/rules'); }
  catch(e){ box.innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`; return; }

  const items = r.items || [];
  const fields = items.map(it => `
    <div class="field">
      <label>${esc(it.name)}${it.changed ? ' <span class="bdg ghost">已改过</span>' : ''}</label>
      ${it.type === 'int'
        ? `<input class="inp" data-rule="${attr(it.key)}" type="number" value="${attr(it.value)}" style="max-width:200px">`
        : `<textarea class="ta" data-rule="${attr(it.key)}" style="min-height:84px">${esc(it.value)}</textarea>`}
      ${it.hint ? `<div class="muted" style="font-size:12px">${esc(it.hint)}</div>` : ''}
      <div class="muted" style="font-size:12px">出厂默认：${esc(it.default)}</div>
    </div>`).join('');

  box.innerHTML = `
    <div class="sec-head">
      <h2>入库规则</h2>
      <span class="sub">Agent 入库时遵守的业务规则 · 改完即对之后入库的文章生效</span>
      <div class="spacer"></div>
      <button class="btn" data-act="reload-rules">
        <svg class="ico" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5"/></svg>刷新
      </button>
    </div>
    <div class="banner tip">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8.2v.3"/></svg>
      <div>这里只有<b>业务规则</b>（摘要多长、标签几个、什么情况进待复核）—— 改错了最多是"结果不合口味"。
      被抓取解析、URL 规范化、切段参数这类<b>技术规则不在此列</b>：它们改错了系统会直接哑掉
      （抓不到正文、查重失效），所以留在代码里。</div>
    </div>
    <div class="panel panel-pad">
      <div class="form">${fields}</div>
      <div style="display:flex;gap:9px;align-items:center;margin-top:14px;flex-wrap:wrap">
        <button class="btn primary" data-act="save-rules">保存</button>
        <span class="muted" style="font-size:12.5px">改完立即生效，不用重启服务；存量文章的摘要不会自动重写</span>
      </div>
    </div>`;
}

async function saveRules(){
  const values = {};
  $$('[data-rule]').forEach(el => { values[el.dataset.rule] = el.value; });
  if (!Object.keys(values).length) return;
  try {
    await apiJson('/api/rules', 'PATCH', { values });
    toast('规则已保存');
    renderRules();
  } catch(e){ showErr(e); }
}

async function saveCategory(key){
  const row = $('[data-catrow="' + key + '"]');
  if (!row) return;
  const name = row.querySelector('[data-f="name"]').value.trim();
  const prefix = row.querySelector('[data-f="prefix"]').value.trim();
  const retrieval = row.querySelector('[data-f="retrieval"]').value;
  const display = row.querySelector('[data-f="display"]').value;
  const criteria = row.querySelector('[data-f="criteria"]').value;
  const principles = row.querySelector('[data-f="principles"]').value;
  const sort_order = parseInt(row.querySelector('[data-f="sort_order"]').value || '0', 10) || 0;
  const features = $$('[data-f="feature"]', row).filter(x => x.checked).map(x => x.value);
  const def = row.querySelector('[data-act="set-default"]');

  try {
    await apiJson('/api/categories/' + encodeURIComponent(key), 'PATCH', {
      name, prefix, retrieval, display, criteria, principles, features, sort_order,
      is_default: (def && def.checked) ? 1 : 0,
    });
    toast('已保存「' + name + '」');
    await loadCategories();
    renderSettings();
  } catch(e){ showErr(e); }
}

async function deleteCategory(key){
  const c = catOf(key);
  if (!c) return;
  if (c.count){
    return toast('「' + c.name + '」下还有 ' + c.count + ' 篇文章，先把它们改成别的分类再删', 4600);
  }
  if (!window.confirm('删除分类「' + c.name + '」？\n\n该分类下没有文章，删除不影响已有内容。')) return;
  try {
    await apiJson('/api/categories/' + encodeURIComponent(key) + '?confirm=yes', 'DELETE');
    toast('已删除「' + c.name + '」');
    await loadCategories();
    renderSettings();
  } catch(e){ showErr(e); }
}

async function addCategory(){
  const key = $('#ncKey').value.trim();
  const name = $('#ncName').value.trim();
  const prefix = $('#ncPrefix').value.trim();
  if (!key || !name || !prefix) return toast('key / 显示名 / 编号前缀都要填');
  const features = $$('.ncfeat').filter(x => x.checked).map(x => x.value);
  try {
    await apiJson('/api/categories', 'POST', {
      key, name, prefix, features,
      retrieval: $('#ncRetrieval').value,
      display: $('#ncDisplay').value,
      criteria: $('#ncCriteria').value,
      principles: $('#ncPrinciples').value,
      sort_order: state.cats.length + 1,
    });
    toast('已新增「' + name + '」');
    await loadCategories();
    renderSettings();
  } catch(e){ showErr(e); }
}

async function submitText(){
  const title = $('#aTitle').value.trim();
  const body  = $('#aBody').value.trim();
  if (!title) return toast('请填标题');
  if (!body)  return toast('请粘贴正文');
  const catBtn = $('#aCat button.on');
  const category = catBtn ? (catBtn.dataset.cat || null) : null;
  const dateRaw = $('#aDate').value.trim();

  const btn = $('[data-act="submit-text"]');
  btn.disabled = true;
  $('#aHint').textContent = '正在切段与向量化，长文需要几秒…';
  try {
    const r = await apiJson('/api/ingest-text', 'POST', {
      title,
      url: $('#aUrl').value.trim() || null,
      source: $('#aSource').value.trim() || null,
      category: category || null,
      published_at: dateRaw ? (dateRaw.length === 10 ? dateRaw + 'T00:00:00+08:00' : dateRaw) : null,
      raw_content: body
    });
    if (r.dup) toast('已存在，未重复入库：' + r.id);
    else toast('入库成功：' + r.id + '（' + (r.chunks || 0) + ' 段' + (r.review_flag ? '，已进待复核' : '') + '）', 4200);
    $('#aHint').innerHTML = r.dup
      ? `库中已有该链接，命中 <b>${esc(r.id)}</b>，未重复写入。`
      : `已入库 <b>${esc(r.id)}</b> · ${r.chunks || 0} 段 · ${r.chars || 0} 字${r.review_flag ? ' · 已进待复核队列' : ''}`;
    $('#aTitle').value = ''; $('#aBody').value = ''; $('#aUrl').value = '';
    loadHealth();
  } catch(e){
    showErr(e);
    $('#aHint').textContent = '入库失败，正文已保留在输入框，可重试。';
  } finally {
    btn.disabled = false;
  }
}

/* ================================================================ 检索结果 */
async function doSearch(q, mode){
  q = (q || '').trim();
  if (!q) return;
  state.search = { q, mode: mode || 'hybrid' };
  $('#tabSearch').hidden = false;
  switchView('search');

  const box = $('#view-search');
  box.innerHTML = `<div class="empty">检索中…（首次检索需加载查询向量）</div>`;
  try {
    const r = await apiGet('/api/search?q=' + encodeURIComponent(q) +
                           '&mode=' + encodeURIComponent(state.search.mode) + '&limit=20');
    const hits = r.hits || [];
    const list = hits.map(h => `
      <div class="hit">
        <div class="hh">
          ${catBadge(h.category)}
          ${h.match_type === 'fulltext' ? '<span class="bdg ghost">全文匹配</span>' : ''}
          <span class="ht">${esc(h.title)}</span>
          <span class="score">${h.match_type === 'fulltext' ? '—' : h.score}</span>
        </div>
        <div class="hm">${esc(h.source || '来源未知')} · ${esc(d10(h.published_at || h.collected_at))} · ${esc(h.article_id)}</div>
        <div class="mc">
          ${(h.matched_chunks || []).map(m => `
            <div>
              ${m.heading_path ? `<div class="mp">${esc(m.heading_path)}</div>` : ''}
              <div class="mt">${esc(m.snippet)}</div>
              <div class="mr">
                ${m.rank_dense ? `<span>语义 #${m.rank_dense}</span>` : ''}
                ${m.rank_sparse ? `<span>词法 #${m.rank_sparse}</span>` : ''}
              </div>
            </div>`).join('')}
        </div>
        <div class="mc" style="border-top:0;padding-top:4px">
          <div style="display:flex;gap:7px;flex-wrap:wrap">
            <button class="btn tiny" data-act="detail" data-id="${attr(h.article_id)}">详情</button>
            ${h.url ? `<a class="btn tiny" href="${attr(h.url)}" target="_blank" rel="noopener">打开原文
              <svg class="ico" style="width:13px;height:13px" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M18 14.5V18a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 18V9a1.5 1.5 0 0 1 1.5-1.5H11"/></svg>
            </a>` : ''}
          </div>
        </div>
      </div>`).join('');

    const modes = { hybrid:'融合', dense:'语义', sparse:'关键词' };
    box.innerHTML = `
      <div class="sec-head">
        <h2>「${esc(q)}」</h2>
        <span class="sub">${modes[state.search.mode] || ''} · 命中 ${r.total} 篇</span>
        <div class="spacer"></div>
        <div class="seg">
          ${['hybrid','dense','sparse'].map(m => `
            <button data-act="research" data-mode="${m}" data-q="${attr(q)}"
              class="${state.search.mode===m?'on':''}">${modes[m]}</button>`).join('')}
        </div>
      </div>
      ${hits.length ? list : `<div class="panel"><div class="empty">
        没有命中。试试换成自己的说法（语义路不怕措辞不同）；找专有名词可切「关键词」。</div></div>`}`;
  } catch(e){
    box.innerHTML = `<div class="empty">检索失败：${esc(e.message)}</div>`;
  }
}

/* ================================================================ 视图切换 */
function switchView(v){
  state.view = v;
  $$('.view').forEach(el => el.classList.toggle('on', el.id === 'view-' + v));
  $$('.tab').forEach(el => el.classList.toggle('on', el.dataset.view === v));
  if (v === 'overview')          renderOverview();
  else if (v === 'review')       renderReview();
  else if (v === 'add')          renderAdd();
  else if (v === 'settings')     renderSettings();
  else if (v === 'rules')        renderRules();
  else if (v === 'tag')          renderTag(state.tag);
  else if (v === 'list')         renderArticleList();
  else if (v === 'tree')         renderTree();
  else if (v === 'tagcloud')     renderTagCloud();
  else if (v === 'tagmerge')     renderTagMerge();
  else if (v.indexOf('cat-') === 0) renderCategory(v.slice(4));
  window.scrollTo(0, 0);
}

/* ================================================================ 模块 9：逻辑主题树（PRD §5.7）

   形态是「目录」而不是「划分」：领域 > 板块 > 话题，上下级靠语义从属。
   早期版本把库互斥切成 20 簇，20 个里有 8 个在讲同一件事（473 篇 = 63%），
   看不到逻辑 —— 原因是划分靠相似度切边界，而主题是连续谱，边界必然模糊。 */
let TREE = null, TREE_CUR = null, TREE_SORT = 'sim';
let TREE_OPEN = new Set(), TREE_SEARCHING = false;

async function renderTree(force){
  const box = $('#view-tree');
  if (TREE && !force) { paintTree(box); return; }
  box.innerHTML = '<div class="empty">正在读取主题结构…</div>';
  try {
    const d = await api('/api/structure');
    if (!d.ready){
      box.innerHTML = '<div class="empty">还没有生效的主题结构。'
        + '先跑 <code>scripts/structure.py mount</code> 挂载、'
        + '确认目录后再 <code>apply</code> 落库。</div>';
      return;
    }
    TREE = d;
    TREE_CUR = d.tree[0] ? d.tree[0].id : null;
    paintTree(box);
  } catch(e){ box.innerHTML = '<div class="empty">读取失败：' + esc(e.message || e) + '</div>'; }
}

function treeIndex(node, out){
  out[node.id] = node;
  (node.children || []).forEach(c => treeIndex(c, out));
  return out;
}

function paintTree(box){
  const map = treeIndex(TREE.tree[0], {});
  // 一棵树里可能有多个领域，先全索引一遍
  TREE.tree.forEach(d => { if (d.id !== TREE.tree[0].id) treeIndex(d, map); });
  const cur = map[TREE_CUR] || TREE.tree[0];
  if (!cur){ box.innerHTML = '<div class="empty">结构为空</div>'; return; }

  const crumb = [];
  (function up(n){ crumb.unshift(n); if (n.parent && map[n.parent]) up(map[n.parent]); })(cur);

  const nav = treeNavHtml(cur, map);
  const kids = (cur.children || []).map(c => treeCardHtml(c, map)).join('');
  const arts = cur.articles.length ? articleTableHtml(cur, cur.articles) : '';
  const unmounted = (TREE.unmounted || []).length ? unmountedHtml(TREE.unmounted) : '';

  box.innerHTML =
    '<div class="tw2">' +
      '<div class="tw2-side">' +
        '<input class="tw2-find" id="treeFind" placeholder="找话题（如：FDE、RAG）">' +
        nav +
      '</div>' +
      '<div class="tw2-main">' +
        '<div class="crumb2">' + crumb.map((n,i) => i === crumb.length-1
          ? '<b>' + esc(n.name) + '</b>' : '<a href="#" data-tnode="' + n.id + '">' + esc(n.name) + '</a>')
          .join('<span>›</span>') + '</div>' +
        '<h2 class="tw2-h">' + esc(cur.name) +
          '<span class="tw2-tag">' + (cur.level === 1 ? '领域' : cur.level === 2 ? '板块' : '话题') +
          ' · ' + cur.count + ' 篇</span></h2>' +
        (cur.summary ? '<p class="tw2-sum">' + esc(cur.summary) + '</p>' : '') +
        (cur.keywords && cur.keywords.length
          ? '<div class="chips">' + cur.keywords.map(k => '<span class="chip">' + esc(k) + '</span>').join('') + '</div>'
          : '') +
        (kids ? '<div class="tw2-subs">' + kids + '</div>' : '') +
        (unmounted ? unmounted : '') +
        arts +
      '</div>' +
    '</div>';

  box.querySelectorAll('[data-tnode]').forEach(el => el.onclick = ev => {
    ev.preventDefault(); TREE_CUR = +el.dataset.tnode; paintTree(box); window.scrollTo(0,0);
  });
  box.querySelectorAll('[data-topen]').forEach(el => el.onclick = ev => {
    ev.preventDefault();
    TREE_CUR = +el.dataset.topen;
    TREE_OPEN.add(TREE_CUR);        // 进入一个节点就顺手展开它，层级关系看得见
    paintTree(box); window.scrollTo(0, 0);
  });
  box.querySelectorAll('[data-ttog]').forEach(el => el.onclick = ev => {
    ev.preventDefault(); ev.stopPropagation();
    const id = +el.dataset.ttog;
    if (TREE_OPEN.has(id)) TREE_OPEN.delete(id); else TREE_OPEN.add(id);
    paintTree(box);                   // 只折叠/展开，不切换当前节点
  });
  box.querySelectorAll('[data-tart]').forEach(el => el.onclick = ev => {
    ev.preventDefault(); openDetail(el.dataset.tart);
  });
  box.querySelectorAll('[data-tsort]').forEach(el => el.onclick = () => {
    TREE_SORT = el.dataset.tsort; paintTree(box);
  });
  const find = $('#treeFind');
  if (find) find.oninput = () => filterTree(box, find.value);
}

/* 左侧树：默认全收起，只在进入某个节点时展开它那条路径（用户 2026-10-07 要求：
   「左边类做成折叠的，层级要更清晰」）。TREE_OPEN 记展开状态，跨渲染保留。 */
/* 搜索：按主题（名称+关键词）匹配。命中的节点**自动展开祖先链** ——
   否则匹配项藏在收起的父节点里，用户会以为"搜不到"。
   不改 DOM 的 display（收起状态由 TREE_OPEN 渲染），改的是「哪些节点展开」。 */
function filterTree(box, raw){
  const q = (raw || '').trim().toLowerCase();
  if (!q){
    TREE_OPEN.clear();
    TREE_SEARCHING = false;
    paintTree(box);
    const f = $('#treeFind');
    if (f){ f.value = ''; f.focus(); }
    return;
  }
  const hits = new Set(), open = new Set();
  (function walk(nodes, ancestors){
    nodes.forEach(n => {
      const hay = (n.name + ' ' + (n.keywords || []).join(' ')).toLowerCase();
      const self = hay.indexOf(q) >= 0;
      if (self){
        hits.add(n.id);
        ancestors.forEach(a => open.add(a));
        // 命中的是**容器**（领域/板块的 keywords 里也有该词，比如「AI 技术」的
        // keywords 含 RAG）时必须展开它自己，否则命中项下面一片空白、看着像没搜到。
        if ((n.children || []).length) open.add(n.id);
      }
      walk(n.children || [], self ? ancestors : ancestors.concat(n.id));
    });
  })(TREE.tree, []);
  TREE_SEARCHING = true;
  TREE_OPEN = open;                    // 只保留「命中项 + 其祖先」的展开集合
  paintTree(box);
  // 再把非命中分支藏掉（可见 = 自己命中，或有子节点可见），从根往下算
  const apply = list => list.forEach(el => {
    const kids = [...el.querySelectorAll(':scope > .tw2-kids > .tw2-n')];
    apply(kids);                        // 递归要传数组：kids.forEach(apply) 会把元素当 list
    const self = hits.has(+el.dataset.tid);
    const kidVis = kids.some(k => k.style.display !== 'none');
    el.style.display = (self || kidVis) ? '' : 'none';
  });
  apply([...box.querySelectorAll('.tw2-nav > .tw2-n')]);
  const f = $('#treeFind');
  if (f){ f.value = raw; f.focus(); f.setSelectionRange(raw.length, raw.length); }
}

function treeNavHtml(cur, map){
  // 祖先链始终展开（要看得见自己在哪），但**不含当前节点自己** ——
  // 含了它会把「收起当前节点」这个操作立刻撤销掉，表现为点箭头收不起来（2026-10-07 实测）。
  const path = new Set();
  (function up(n){ if (n.parent && map[n.parent]){ path.add(n.parent); up(map[n.parent]); } })(cur);
  // 搜索中**不要**强制展开当前位置的祖先：那会覆盖搜索算出的展开集合，
  // 结果是「搜 RAG 却什么都看不到」（2026-10-07 实测）。
  if (!TREE_SEARCHING) path.forEach(id => TREE_OPEN.add(id));

  const walk = (nodes, depth) => nodes.map(n => {
    const kids = n.children || [];
    const open = TREE_OPEN.has(n.id);
    const kidsHtml = (kids.length && open)
      ? '<div class="tw2-kids">' + walk(kids, depth + 1) + '</div>' : '';
    // 三角必须在 <a> 内部：外面那个是 inline-flex、a 是 flex，并排会掉成两行
    // （用户反馈「三角和名字不在一行」）。
    return '<div class="tw2-n' + (n.id === cur.id ? ' on' : '') +
      (path.has(n.id) ? ' inpath' : '') + '" style="--d:' + depth +
      '" data-tid="' + n.id + '" data-tname="' +
      esc((n.name + ' ' + (n.keywords || []).join(' ')).toLowerCase()) + '">' +
      '<a href="#" class="tw2-row" data-topen="' + n.id + '">' +
      (kids.length
        ? '<span class="tw2-tw' + (open ? ' open' : '') + '" data-ttog="' + n.id + '">' +
          (open ? '−' : '+') + '</span>'
        : '<span class="tw2-tw leaf"></span>') +
      '<span class="tw2-nm">' + esc(n.name) + '</span>' +
      '<span class="tw2-c">' + n.count + '</span></a>' + kidsHtml + '</div>';
  }).join('');
  return '<div class="tw2-nav">' + walk(TREE.tree, 0) + '</div>';
}

function treeCardHtml(n, map){
  const cls = n.level === 1 ? 'c1' : n.level === 2 ? 'c2' : 'c3';
  const sub = n.summary ? esc(n.summary.length > 46 ? n.summary.slice(0,46) + '…' : n.summary) : '';
  return '<div class="tw2-card ' + cls + '" data-topen="' + n.id + '">' +
    '<div class="tw2-cn">' + esc(n.name) + '<span class="tw2-cc">' + n.count + ' 篇</span></div>' +
    (sub ? '<div class="tw2-cs">' + sub + '</div>' : '') + '</div>';
}

function articleTableHtml(node, list){
  const arr = [...list].sort((a,b) => TREE_SORT === 'sim'
    ? (b.sim || 0) - (a.sim || 0) : String(b.date).localeCompare(String(a.date)));
  const rows = arr.map(a =>
    '<tr><td class="ta-t"><a href="#" data-tart="' + esc(a.id) + '">' + esc(a.title) + '</a>'
    + (a.role === 'secondary' ? '<span class="ta-sub">次要归属</span>' : '')
    + '</td><td class="ta-m"><span class="badge">' + esc(catName(a.category)) + '</span>'
    + esc(a.id) + '</td><td class="ta-d">' + esc(a.date) + '</td>'
    + '<td class="ta-s">' + (a.sim != null ? a.sim : '') + '</td></tr>').join('');
  return '<div class="tw2-arts"><div class="tw2-ah">'
    + (node.level === 3 ? '这个话题下的文章' : '这一片下的文章（跨话题去重）')
    + '<span>' + arr.length + ' 篇</span>'
    + '<button class="seg' + (TREE_SORT === 'sim' ? ' on' : '') + '" data-tsort="sim">按相似度</button>'
    + '<button class="seg' + (TREE_SORT === 'date' ? ' on' : '') + '" data-tsort="date">按时间</button>'
    + '</div><table class="tw2-tb"><thead><tr><th>标题</th><th>分类 / 编号</th>'
    + '<th>日期</th><th class="ta-s">相似度</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function unmountedHtml(list){
  return '<div class="tw2-unm"><b>还没归类的 ' + list.length + ' 篇</b>'
    + '<span>任何话题都不够像（阈值 0.6），没有硬塞进去。点标题看内容，觉得该归哪儿就手动挪。</span>'
    + '<div>' + list.map(a =>
        '<a href="#" data-tart="' + esc(a.id) + '">' + esc(a.title.slice(0,34)) + '</a>').join('')
    + '</div></div>';
}

/* ================================================================ 模块 10：标签词云

   词云刻意**原样画全部标签、不做归并**：归并涉及「哪个词该并到哪个词」的判断，
   那是用户的决定。词云的价值是把碎片化摊开给人看 —— 实测 2166 个标签 / 752 篇，
   78% 只出现一次，同义标签（Agent / AI Agent / 智能体）并排出现。 */
let CLOUD = null, CLOUD_N = 120, CLOUD_CAT = '', CLOUD_BOXES = [];

async function renderTagCloud(){
  const box = $('#view-tagcloud');
  box.innerHTML = '<div class="empty">正在统计标签…</div>';
  try {
    if (!CLOUD) CLOUD = await api('/api/tags');
    paintCloud(box);
  } catch(e){ box.innerHTML = '<div class="empty">读取失败：' + esc(e.message || e) + '</div>'; }
}

function paintCloud(box){
  const cats = CLOUD.categories || {};
  const tags = CLOUD.tags.filter(t => t.n >= 2
    && (!CLOUD_CAT || (t.c[CLOUD_CAT] || 0) > 0));
  const once = CLOUD.tags.length - CLOUD.tags.filter(t => t.n >= 2).length;
  box.innerHTML =
    '<div class="cl-bar">' +
      '<div class="cl-meta"><b>' + CLOUD.total_tags + '</b> 个标签 / <b>' +
        CLOUD.total_articles + '</b> 篇 · 前 <b>' + CLOUD.tags_for_90 +
        '</b> 个就覆盖 90% 文章 · 只出现 1 次的 <b>' + once + '</b> 个没画</div>' +
      '<div class="cl-ctl">' +
        '<button class="seg' + (CLOUD_CAT === '' ? ' on' : '') + '" data-cc="">全部</button>' +
        Object.keys(cats).map(k =>
          '<button class="seg' + (CLOUD_CAT === k ? ' on' : '') + '" data-cc="' + esc(k) + '">' +
          esc(cats[k]) + '</button>').join('') +
        '<span class="cl-sep"></span>' +
        [80,120,300].map(n =>
          '<button class="seg' + (CLOUD_N === n ? ' on' : '') + '" data-cn="' + n + '">' + n + ' 词</button>').join('') +
      '</div>' +
    '</div>' +
    '<div class="cl-hint">词<b>大小 = 文章数</b>，<b>颜色 = 该标签下文章的主导分类</b>。' +
      '注意同义标签会并排出现（<b>Agent</b> / <b>AI Agent</b> / <b>智能体</b> 指同一件事）' +
      ' —— 这就是标签碎片化的样子，规范化术语后可合并的地方一目了然。</div>' +
    '<div class="cl-wrap"><canvas id="clCanvas"></canvas>' +
      '<aside class="cl-side" id="clSide"><div class="empty">点云里任意一个词，' +
      '这里列出带这个标签的全部文章。</div></aside></div>';

  box.querySelectorAll('[data-cc]').forEach(b => b.onclick = () => {
    CLOUD_CAT = b.dataset.cc; paintCloud(box);
  });
  box.querySelectorAll('[data-cn]').forEach(b => b.onclick = () => {
    CLOUD_N = +b.dataset.cn; paintCloud(box);
  });
  readPalette();
  drawCloud($('#clCanvas'), tags.slice(0, CLOUD_N));
}

/* 词云配色：分类 → 莫兰迪色板。**必须先把 CSS 变量读成真实色值** ——
   canvas 的 fillStyle 不解析 var(--c0)，直接赋值会静默失效、整片画成黑色
   （2026-10-07 用户指出「颜色没实现」）。 */
const CLOUD_PALETTE = {};
function readPalette(){
  const cs = getComputedStyle(document.documentElement);
  const keys = {idea:'--c0', tech:'--c1', app:'--c2', health:'--c3', dao:'--c4'};
  Object.keys(keys).forEach(k => {
    const v = cs.getPropertyValue(keys[k]).trim();
    CLOUD_PALETTE[k] = v || '#888';
  });
}
function cloudColor(dist){
  const e = Object.entries(dist).sort((a,b) => b[1] - a[1])[0];
  return (e && CLOUD_PALETTE[e[0]]) || CLOUD_PALETTE.idea || '#888';
}

function drawCloud(cv, list){
  if (!Object.keys(CLOUD_PALETTE).length) readPalette();
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 800, H = 520;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.height = H + 'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.textBaseline = 'top';
  CLOUD_BOXES = [];
  if (!list.length) return;
  const max = list[0].n;
  const hit = (a, b) => !(a.x + a.w < b.x || b.x + b.w < a.x
                         || a.y + a.h < b.y || b.y + b.h < a.y);
  list.forEach(t => {
    const fs = Math.round(12 + 34 * Math.max(0, Math.min(1,
      (Math.sqrt(t.n / max) - 0.15) / 0.85)));
    ctx.font = '600 ' + fs + 'px -apple-system,"PingFang SC",sans-serif';
    const w = ctx.measureText(t.t).width + 10, h = fs * 1.18;
    let box = null;
    for (let ring = 0; ring < Math.max(W, H) && !box; ring += 5){
      for (let a = 0; a < 360; a += 5){
        const rad = a * Math.PI / 180;
        const x = W/2 + ring * Math.cos(rad) - w/2;
        const y = H/2 + ring * Math.sin(rad) * 0.6 - h/2;
        if (x < 2 || y < 2 || x + w > W-2 || y + h > H-2) continue;
        const b = {x:x, y:y, w:w, h:h};
        if (CLOUD_BOXES.every(p => !hit(p, b))){ box = b; break; }
      }
    }
    if (!box) return;
    box.tag = t; CLOUD_BOXES.push(box);
    ctx.fillStyle = cloudColor(t.c);
    ctx.globalAlpha = 0.82 + 0.18 * (t.n / max);
    ctx.fillText(t.t, box.x + 5, box.y);
  });
  ctx.globalAlpha = 1;
  cv.onclick = ev => {
    const r = cv.getBoundingClientRect();
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    const b = CLOUD_BOXES.find(p => mx >= p.x && mx <= p.x + p.w
      && my >= p.y && my <= p.y + p.h);
    if (b) showTagArticles(b.tag);
  };
  cv.onmousemove = ev => {
    const r = cv.getBoundingClientRect();
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    const b = CLOUD_BOXES.find(p => mx >= p.x && mx <= p.x + p.w
      && my >= p.y && my <= p.y + p.h);
    cv.style.cursor = b ? 'pointer' : 'default';
    cv.title = b ? b.tag.t + ' · ' + b.tag.n + ' 篇' : '';
  };
}

function showTagArticles(t){
  // 侧栏只留文章标题（用户 2026-10-07：不用加类别）
  const arts = t.ids.map(id => CLOUD.articles[id]).filter(Boolean)
    .sort((a,b) => state.order === 'asc'
      ? String(a.id).localeCompare(String(b.id)) : String(b.id).localeCompare(String(a.id)));
  $('#clSide').innerHTML = '<h3 class="cl-sh">' + esc(t.t)
    + '<span>' + t.n + ' 篇</span></h3>'
    + orderSwitch()
    + arts.map(a => '<div class="cl-a" data-cid="' + esc(a.id) + '">'
      + esc(a.t || a.id) + '</div>').join('');
  $('#clSide').querySelectorAll('.cl-a').forEach(el =>
    el.onclick = () => openDetail(el.dataset.cid));
  $('#clSide').querySelectorAll('[data-act]').forEach(el => {
    el.onclick = () => { state.order = el.dataset.order;
      localStorage.setItem('myrag.order', state.order); showTagArticles(t); };
  });
}

window.addEventListener('resize', () => {
  if (state.view === 'tagcloud' && CLOUD) drawCloud($('#clCanvas'), cloudList());
});
function cloudList(){
  return CLOUD.tags.filter(t => t.n >= 2 && (!CLOUD_CAT || (t.c[CLOUD_CAT] || 0) > 0))
    .slice(0, CLOUD_N);
}

/* ================================================================ 模块 11：术语归并

   这一页的立场：**规范名由用户拍板，系统只负责把候选摆出来**。
   早先试过自动合并（向量相似 ≥0.85 就并），结果是「企业转型 + 职业转型 + 组织转型」
   被串成一组 —— 那是两件完全不同的事。所以这里只有逐条勾选，没有「一键全合」。 */
let TM = null, TM_SEL = null;

async function renderTagMerge(){
  const box = $('#view-tagmerge');
  box.innerHTML = '<div class="empty">正在读取标签现状…</div>';
  try {
    TM = await api('/api/tag-merge');
    TM.edited = {};
    TM_SEL = {
      literal: new Set(TM.literal.map((g, i) => i)),
      vec: new Set(),
      fam: new Map()
    };
    paintMerge(box);
  } catch(e){ box.innerHTML = '<div class="empty">读取失败：' + esc(e.message || e) + '</div>'; }
}

function canonOf(set, i, dflt){
  return (TM.edited && TM.edited[set + ':' + i]) || dflt;
}

function mergeChosen(){
  const out = [];
  const put = (c, a) => {
    const hit = out.find(o => o.canonical === c);
    if (hit){ if (!hit.aliases.includes(a)) hit.aliases.push(a); }
    else out.push({ canonical: c, aliases: [a] });
  };
  TM.literal.forEach((g, i) => {
    if (TM_SEL.literal.has(i)){
      const c = canonOf('literal', i, g.canonical);
      g.aliases.forEach(a => put(c, a));
    }
  });
  TM.vector_pairs.forEach((p, i) => {
    if (TM_SEL.vec.has(i)) put(canonOf('vec', i, p.a), p.b);
  });
  TM.families.forEach((f, fi) => f.tags.forEach(t => {
    if (TM_SEL.fam.get(fi + ':' + t.t)) put(f.core, t.t);
  }));
  return out.filter(m => m.aliases.length && !m.aliases.includes(m.canonical));
}

function paintMerge(box){
  const chosen = mergeChosen();
  const removed = new Set();
  chosen.forEach(g => g.aliases.forEach(a => removed.add(a)));

  let h = '<div class="tm-bar">' +
    '<div class="tm-meta">当前 <b>' + TM.total_tags + '</b> 个标签 / ' +
      TM.n_articles + ' 篇 · 已生效映射 <b>' + TM.aliases.length + '</b> 条' +
      (TM.pending.length ? ' · 未纳入规范的新标签 <b>' + TM.pending.length + '</b> 个' : '') +
    '</div>' +
    '<button class="btn" id="tmClear">取消全部勾选</button>' +
    '<button class="btn primary" id="tmApply"' + (chosen.length ? '' : ' disabled') + '>' +
      '应用 ' + chosen.length + ' 条归并</button></div>' +
    '<div class="tm-prev">按当前勾选，应用后：<b>' + TM.total_tags + ' → ' +
      (TM.total_tags - removed.size) + '</b> 个标签（少 ' + removed.size + ' 个写法）' +
      (chosen.length ? '；规范名：' + esc([...new Set(chosen.map(c=>c.canonical))].join('、'))
        : '') + '</div>' +
    (TM.vector_stale ? '<div class="tm-warn">没找到语义相似候选的缓存文件，只有字面同组可勾。</div>' : '');

  h += '<div class="tm-sec"><div class="tm-sh">① 只差大小写 / 空格 / 全半角的，' +
    '必然是同一个<span>' + TM_SEL.literal.size + ' / ' + TM.literal.length + ' 已勾</span></div>' +
    '<div class="tm-rows">' + TM.literal.map((g, i) =>
      '<label class="tm-item' + (TM_SEL.literal.has(i) ? ' on' : '') + '">' +
      '<input type="checkbox" data-tm-tog data-tm-set="literal" data-tm-idx="' + i + '"' +
        (TM_SEL.literal.has(i) ? ' checked' : '') + '>' +
      '<span class="tm-cn" data-tm-canon="literal" data-tm-idx="' + i + '" contenteditable="true">' +
        esc(canonOf('literal', i, g.canonical)) + '</span>' +
      '<span class="tm-ar">←</span>' +
      g.aliases.map(a => '<span class="tm-al">' + esc(a) +
        (g.counts[a] ? '<i>' + g.counts[a] + '</i>' : '') + '</span>').join('') +
      '</label>').join('') + '</div></div>';

  if (TM.vector_pairs.length){
    h += '<div class="tm-sec"><div class="tm-sh">② 向量认为相近，' +
      '但可能只是「共享了一个词」，请逐条判断<span>' + TM_SEL.vec.size + ' / ' +
      TM.vector_pairs.length + ' 已勾</span></div><div class="tm-rows">' +
      TM.vector_pairs.map((p, i) =>
        '<label class="tm-item' + (TM_SEL.vec.has(i) ? ' on' : '') + '">' +
        '<input type="checkbox" data-tm-tog data-tm-set="vec" data-tm-idx="' + i + '"' +
          (TM_SEL.vec.has(i) ? ' checked' : '') + '>' +
        '<span class="tm-cn" data-tm-canon="vec" data-tm-idx="' + i + '" contenteditable="true">' +
          esc(canonOf('vec', i, p.a)) + '</span>' +
        '<span class="tm-ar">←</span><span class="tm-al">' + esc(p.b) +
          (p.nb ? '<i>' + p.nb + '</i>' : '') + '</span>' +
        '<span class="tm-sim">cos ' + p.sim + '</span></label>').join('') +
      '</div></div>';
  }

  if (TM.families.length){
    h += '<div class="tm-sec"><div class="tm-sh">③ 词族：含同一核心词的众多写法' +
      '<span>向量抓不到跨语言同义（Agent ↔ 智能体），只能你圈定</span></div>';
    TM.families.forEach((f, fi) => {
      h += '<div class="tm-fam"><div class="tm-fn">' + esc(f.core) + ' 家族 · ' +
        f.tags.length + ' 种写法<button class="btn" data-tm-famall="' + fi +
        '">把「' + esc(f.core) + '」本身之外的都并进来</button></div><div class="tm-tags">' +
        f.tags.map(t => {
          const k = fi + ':' + t.t, on = TM_SEL.fam.get(k);
          return '<label class="tm-tag' + (on ? ' on' : '') + '">' +
            '<input type="checkbox" data-tm-famtog data-tm-fam="' + fi +
            '" data-tm-tag="' + esc(t.t) + '"' + (on ? ' checked' : '') + '>' +
            esc(t.t) + '<i>' + t.n + '</i></label>';
        }).join('') + '</div></div>';
    });
    h += '</div>';
  }

  if (TM.aliases.length){
    const byCanon = {};
    TM.aliases.forEach(a => (byCanon[a.canonical] = byCanon[a.canonical] || []).push(a));
    h += '<div class="tm-sec"><div class="tm-sh">已生效的映射（' + TM.aliases.length +
      ' 条）<span>每次入库自动套用</span></div><div class="tm-rows">' +
      Object.keys(byCanon).map(c => '<div class="tm-row"><span class="tm-cn">' + esc(c) +
        '</span><span class="tm-ar">←</span>' + byCanon[c].map(a =>
        '<span class="tm-al">' + esc(a.alias) +
        (a.count ? '<i>' + a.count + '</i>' : '') + '</span>').join('') + '</div>').join('') +
      '</div></div>';
  }

  box.innerHTML = h + '</div>';

  box.querySelectorAll('[data-tm-tog]').forEach(el => el.onchange = () => {
    const s = TM_SEL[el.dataset.tmSet], i = +el.dataset.tmIdx;
    if (el.checked) s.add(i); else s.delete(i);
    paintMerge(box);
  });
  box.querySelectorAll('[data-tm-canon]').forEach(el => el.oninput = () => {
    TM.edited[el.dataset.tmCanon + ':' + el.dataset.tmIdx] = el.textContent.trim();
    const b = $('#tmApply');
    if (b) b.textContent = '应用 ' + mergeChosen().length + ' 条归并';
  });
  box.querySelectorAll('[data-tm-famtog]').forEach(el => el.onchange = () => {
    const k = el.dataset.tmFam + ':' + el.dataset.tmTag;
    if (el.checked) TM_SEL.fam.set(k, true); else TM_SEL.fam.delete(k);
    el.parentElement.classList.toggle('on', el.checked);
  });
  box.querySelectorAll('[data-tm-famall]').forEach(b => b.onclick = () => {
    const fi = +b.dataset.tmFamAll, f = TM.families[fi];
    f.tags.forEach(t => { if (t.t !== f.core) TM_SEL.fam.set(fi + ':' + t.t, true); });
    paintMerge(box);
  });
  const clr = $('#tmClear');
  if (clr) clr.onclick = () => {
    TM_SEL.literal.clear(); TM_SEL.vec.clear(); TM_SEL.fam.clear();
    paintMerge(box);
  };
  const ap = $('#tmApply');
  if (ap) ap.onclick = applyMerges;
}

async function applyMerges(){
  const list = mergeChosen();
  if (!list.length) return;
  const preview = list.slice(0, 6).map(g => esc(g.canonical) + ' ← ' +
    g.aliases.map(esc).join('、')).join('\n');
  if (!confirm('将改写这 ' + list.length + ' 组涉及的 articles.tags（会自动备份）：\n\n' +
      preview + (list.length > 6 ? '\n……' : '') + '\n\n确定应用？')) return;
  try {
    // 用项目现成的 apiJson：它带 Content-Type。之前自己拼 fetch 漏了头，
    // FastAPI 把 body 当字符串解析，直接 422（2026-10-07 实测）。
    const r = await apiJson('/api/tag-merge/apply', 'POST', { merges: list });
    toast('已归并 ' + r.tags_merged + ' 个写法，涉及 ' + r.articles_changed + ' 篇');
    await renderTagMerge();
    CLOUD = null;
    if (state.view === 'tagcloud') renderTagCloud();
  } catch(e){ showErr(e); }
}

function closeDrawer(){
  $('#drawer').classList.remove('on');
  $('#drawer').setAttribute('aria-hidden', 'true');
  $('#scrim').classList.remove('on');
  document.body.style.overflow = '';
}

async function openDetail(id){
  $('#drawer').classList.add('on');
  $('#drawer').setAttribute('aria-hidden', 'false');
  $('#scrim').classList.add('on');
  document.body.style.overflow = 'hidden';
  $('#dTitle').textContent = '加载中…';
  $('#dMeta').innerHTML = '';
  $('#dBody').innerHTML = '<div class="empty">加载中…</div>';
  $('#dFoot').innerHTML = '';

  let a;
  try { a = await apiGet('/api/articles/' + encodeURIComponent(id)); }
  catch(e){
    $('#dTitle').textContent = '加载失败';
    $('#dBody').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    return;
  }
  state.detail = a;
  renderDetail(a);
}

function repoLabel(url){
  if (!url) return '';
  return String(url).replace(/^https?:\/\/(www\.)?github\.com\//i, '').replace(/\/+$/, '');
}

function renderDetail(a){
  const hasCard = hasFeature(a.category, 'repo_card');
  $('#dTitle').textContent = a.title || '(无标题)';

  // 头部只留"人一眼要看的"：类别、待复核标记、来源、作者、日期。
  // 编号这类备查信息挪到底部折叠区（原来的位置等于占着最好的地方展示没人看的东西）。
  $('#dMeta').innerHTML = `
    ${catBadge(a.category)}
    ${a.review_flag ? '<span class="bdg warn">判类待确认</span>' : ''}
    <span>${esc(a.source || '来源未知')}</span>
    ${a.author ? `<span>${esc(a.author)}</span>` : ''}
    <span>${esc(d10(a.published_at || a.collected_at))}</span>`;

  const attachments = a.attachments || [];
  const concepts = a.concepts || [];
  const related = a.related_articles || [];
  const chunks = a.chunks || [];

  // ① 摘要 + 标签：人最该先看到的
  const summaryBlock = `
    <div class="block">
      <div class="sum">${a.summary ? esc(a.summary) : '<em>（无摘要）</em>'}</div>
      ${(a.tags && a.tags.length) ? `<div class="tagline">${a.tags.map(t =>
        `<span class="tag link" data-act="tag" data-tag="${attr(t)}" title="看所有带此标签的文章">${esc(t)}</span>`).join('')}</div>` : ''}
    </div>`;

  // ② 项目实况：仓库 / star / license 一行扫完；语言、创建日期、提交日期降为灰字一行；
  //    真正需要读的「能力边界」「部署条件」单独成块、完整显示
  const repoBlock = hasCard ? `
    <div class="block">
      <h3>项目实况</h3>
      <div class="repo-head">
        ${a.repo_url
          ? `<a class="name" href="${attr(a.repo_url)}" target="_blank" rel="noopener">${esc(repoLabel(a.repo_url))}</a>`
          : '<span class="name muted">仓库未登记</span>'}
        ${a.stars != null ? `<span class="bdg ghost">★ ${Number(a.stars).toLocaleString()}</span>` : ''}
        ${a.license ? `<span class="bdg ghost">${esc(a.license)}</span>` : ''}
        ${verdictBadge(a.verdict)}
      </div>
      <div class="repo-sub">
        ${a.language ? `<span>${esc(a.language)}</span>` : ''}
        ${a.created_date ? `<span>创建 ${esc(d10(a.created_date))}</span>` : ''}
        ${a.last_commit ? `<span>最近提交 ${esc(d10(a.last_commit))}</span>` : ''}
        <span>${a.last_release ? '发版 ' + esc(a.last_release) : '无正式发版'}</span>
      </div>
      ${(a.boundary || a.deploy_note) ? `
      <div class="repo-key">
        ${a.boundary ? `<div class="k">能力边界</div><div class="v">${esc(a.boundary)}</div>` : ''}
        ${a.deploy_note ? `<div class="k">部署条件</div><div class="v">${esc(a.deploy_note)}</div>` : ''}
      </div>` : ''}
    </div>` : '';

  const conceptBlock = (concepts.length || related.length) ? `
    <div class="block">
      <h3>概念互链</h3>
      ${concepts.length ? concepts.map(c => `
        <div style="margin-bottom:9px">
          <b style="font-size:13.5px">${esc(c.name)}</b>
          ${c.definition ? `<div style="color:var(--text-2);font-size:12.8px;line-height:1.7;margin-top:3px">${esc(c.definition)}</div>` : ''}
          ${(c.related && c.related.length) ? `<div class="tagline">${c.related.map(n =>
            `<span class="tag link" data-act="concept" data-name="${attr(n)}">${esc(n)}</span>`).join('')}</div>` : ''}
        </div>`).join('') : ''}
      ${related.length ? `
        <div style="margin-top:10px;border-top:1px dashed var(--border);padding-top:9px">
          <div class="muted" style="font-size:12.5px;margin-bottom:6px">相关文章</div>
          ${related.map(r => `
            <div style="display:flex;gap:8px;align-items:baseline;margin:5px 0">
              ${catBadge(r.category)}
              <a href="#" data-act="detail" data-id="${attr(r.id)}" style="font-size:13px">${esc(r.title)}</a>
            </div>`).join('')}
        </div>` : ''}
    </div>` : '';

  const attachBlock = attachments.length ? `
    <div class="block">
      <h3>配图 · ${attachments.length} 张（已本地化）</h3>
      <div class="thumbs">
        ${attachments.map(p => `<img src="${attr(API_BASE + '/' + p)}" loading="lazy"
          data-act="zoom" data-src="${attr(API_BASE + '/' + p)}" alt="">`).join('')}
      </div>
    </div>` : '';

  const chunkBlock = chunks.length ? `
    <div class="block">
      <h3>分段 · ${chunks.length} 段（切段供检索定位）</h3>
      ${chunks.map(c => `
        <details class="chunkitem">
          <summary>
            <span class="bdg ghost">#${c.ordinal}</span>
            <span>${esc(c.heading_path || '（无标题段）')}</span>
            <span class="muted" style="margin-left:auto">${c.token_count || 0} tok</span>
          </summary>
          <div class="ctext">${esc(c.text).replace(/!\[[^\]]*\]\([^)]*\)/g, '[图]')}</div>
        </details>`).join('')}
    </div>` : '';

  // ⑤ 备查信息：编号 / 底本 / 时间戳 / 核查记录
  //    这些"只有排查问题才看"的东西默认收起，不该占视线
  const spareBlock = `
    <details class="spare">
      <summary>备查信息 · 编号 / 底本 / 时间戳 / 核查记录</summary>
      <div class="inner">
        <div class="kvgrid">
          <div class="k">编号</div><div class="v">${esc(a.id)}</div>
          <div class="k">原文链接</div><div class="v">${a.url
            ? `<a href="${attr(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a>` : '（无）'}</div>
          <div class="k">原文底本</div><div class="v">${a.raw_url
            ? `<a href="${attr(API_BASE + a.raw_url)}" target="_blank" rel="noopener">${esc(a.raw_path)}</a>` : '—'}</div>
          <div class="k">入库时间</div><div class="v">${esc(dt(a.collected_at))}</div>
          ${a.review_due ? `<div class="k">复评提醒</div><div class="v">${esc(d10(a.review_due))} 起自动进入「待复核」队列，提醒你回头看看它变了没</div>` : ''}
          ${hasCard ? `<div class="k">核查时间</div><div class="v">${a.verified_at ? esc(dt(a.verified_at)) : '未核查'}</div>` : ''}
          ${(a.evidence && a.evidence.source_url) ? `<div class="k">核查依据</div><div class="v">
            <a href="${attr(a.evidence.source_url)}" target="_blank" rel="noopener">${esc(a.evidence.source_url)}</a>
            ${a.evidence.error ? ` · <span style="color:var(--danger)">${esc(a.evidence.error)}</span>` : ''}
          </div>` : ''}
        </div>
      </div>
    </details>`;

  let html = a.content_html || '';
  html = html.replace(/(src|href)="\/(media|raw)\//g, '$1="' + API_BASE + '/$2/');

  $('#dBody').innerHTML = `
    ${summaryBlock}
    ${repoBlock}
    ${conceptBlock}
    ${attachBlock}
    <div class="block">
      <h3>原文</h3>
      <div class="md">${html || '<span class="muted">（原文文件缺失）</span>'}</div>
    </div>
    ${chunkBlock}
    ${spareBlock}`;

  $('#dFoot').innerHTML = `
    ${a.review_flag ? `<button class="btn primary" data-act="confirm-review" data-id="${attr(a.id)}">
      <svg class="ico" viewBox="0 0 24 24"><path d="M5 12.5 9.5 17 19 7"/></svg>确认分类</button>` : ''}
    <div class="seg" id="dCat">
      ${state.cats.map(c =>
        `<button data-act="drawer-cat" data-id="${attr(a.id)}" data-cat="${attr(c.key)}"
          class="${c.key === a.category ? 'on' : ''}"
          title="判据：${attr(c.criteria || '（这一类没写判据）')}">${esc(c.name)}</button>`).join('')}
    </div>
    <button class="btn" data-act="edit-meta" data-id="${attr(a.id)}">
      <svg class="ico" viewBox="0 0 24 24"><path d="M5 19h3l9.5-9.5a2 2 0 0 0-3-3L5 16z"/></svg>改摘要/标签
    </button>
    ${hasCard ? `<button class="btn" data-act="verify" data-id="${attr(a.id)}">
      <svg class="ico" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5"/></svg>重新核查</button>` : ''}
    <div class="spacer" style="flex:1"></div>
    ${a.url ? `<a class="btn" href="${attr(a.url)}" target="_blank" rel="noopener">打开原文
      <svg class="ico" style="width:13px;height:13px" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M18 14.5V18a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 18V9a1.5 1.5 0 0 1 1.5-1.5H11"/></svg>
    </a>` : ''}
    <button class="btn danger" data-act="delete" data-id="${attr(a.id)}">
      <svg class="ico" viewBox="0 0 24 24"><path d="M6 7h12M9.5 7V5.5h5V7M8 7l.8 12h6.4L16 7"/></svg>删除
    </button>`;
}

/* ---- 抽屉内的写操作 ---- */
async function setCategory(id, cat){
  try {
    const r = await apiJson('/api/articles/' + encodeURIComponent(id), 'PATCH', { category: cat });
    toast('已改为 ' + catName(r.category) + '，待复核标记已清除');
    if (state.detail && state.detail.id === id){
      state.detail.category = r.category;
      state.detail.review_flag = 0;
      renderDetail(state.detail);
    }
    if (state.view === 'review') renderReview(false);
    if (state.view === 'overview') renderOverview();
    loadHealth();
  } catch(e){ showErr(e); }
}

/* 确认复核：判断没问题就放行。
   清 review_flag 与"复评周期顺延"都在服务端做，前端不重复实现这套规则。 */
async function confirmReview(id){
  try {
    const r = await apiJson('/api/articles/' + encodeURIComponent(id) + '/confirm', 'POST');
    toast(r.next_due ? ('已确认，下次复评 ' + String(r.next_due).slice(0, 10))
                     : '已确认，移出待复核', 3200);
    if (state.detail && state.detail.id === id){
      state.detail.review_flag = 0;
      if (r.next_due) state.detail.review_due = r.next_due;
      renderDetail(state.detail);
    }
    if (state.view === 'review')   renderReview(false);
    if (state.view === 'overview') renderOverview();
    loadHealth();
  } catch(e){ showErr(e); }
}

async function verifyOne(id, btn){
  if (btn){ btn.disabled = true; btn.innerHTML = '<svg class="ico spin" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5"/></svg>核查中…'; }
  try {
    const r = await apiJson('/api/articles/' + encodeURIComponent(id) + '/verify', 'POST');
    toast('核查完成：' + (r.data && r.data.license ? r.data.license + ' · ' : '') +
          (r.data && r.data.stars != null ? '★' + r.data.stars : '已刷新'), 3600);
    await openDetail(id);
  } catch(e){
    showErr(e);
    await openDetail(id);
  }
}

async function editMeta(id){
  const a = state.detail;
  if (!a) return;
  const summary = window.prompt('摘要（≤60 字）', a.summary || '');
  if (summary === null) return;
  const tagsRaw = window.prompt('标签，英文逗号分隔', (a.tags || []).join(','));
  if (tagsRaw === null) return;
  const tags = tagsRaw.split(',').map(s => s.trim()).filter(Boolean);
  const verdict = hasFeature(a.category, 'repo_card')
    ? (window.prompt('建议：try / watch / dead（留空表示不改）', a.verdict || '') || '')
    : '';
  const body = { summary, tags };
  if (verdict && VERDICT[verdict]) body.verdict = verdict;
  try {
    await apiJson('/api/articles/' + encodeURIComponent(id), 'PATCH', body);
    toast('已保存');
    await openDetail(id);
  } catch(e){ showErr(e); }
}

async function delOne(id){
  const a = state.detail;
  if (!window.confirm('确定删除 ' + id + '？\n\n会同时删除原文 Markdown 与配图，不可恢复。\n' +
                      '（标题：' + ((a && a.title) || '') + '）')) return;
  try {
    await apiJson('/api/articles/' + encodeURIComponent(id) + '?confirm=yes', 'DELETE');
    toast('已删除 ' + id);
    closeDrawer();
    loadHealth();
    if (state.view === 'overview') renderOverview();
    if (state.view === 'review') renderReview(false);
    if (state.view === 'list') renderArticleList();
    if (state.view.indexOf('cat-') === 0) renderCategory(state.view.slice(4));
  } catch(e){ showErr(e); }
}

/* ================================================================ 事件委托 */
document.addEventListener('click', ev => {
  const stop = ev.target.closest('[data-stop]');
  if (stop) ev.stopPropagation();

  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  // 行内链接（原文/底本）与标了 data-stop 的元素不触发所在行/卡片的点击
  if (ev.target.closest('a[target="_blank"]') || stop) return;

  const id = el.dataset.id;

  switch(act){
    /* ---- 关于弹窗（点左上角名称打开）---- */
    case 'about':
      ev.preventDefault();
      openAbout();
      break;

    case 'close-about':
      closeAbout();
      break;

    case 'save-name': {
      const n = saveAppName($('#aboutName') ? $('#aboutName').value : '');
      toast('名称已改为「' + n + '」');
      closeAbout();
      break;
    }

    case 'reset-name':
      saveAppName('');
      toast('已恢复默认名称「' + APP_NAME_DEFAULT + '」');
      break;

    case 'tab':
      ev.preventDefault();
      switchView(el.dataset.view);
      break;

    case 'cat-sub':
      state.sub[el.dataset.cat] = el.dataset.sub;
      renderCategory(el.dataset.cat);
      break;

    case 'concept-search':
      renderConcepts(el.dataset.clear ? '' : ($('#cq') ? $('#cq').value.trim() : ''));
      break;

    case 'concept': {
      const name = el.dataset.name;
      if (state.view.indexOf('cat-') === 0){ renderConcepts(name); }
      else { closeDrawer(); $('#q').value = name; doSearch(name, 'hybrid'); }
      break;
    }

    case 'detail':
      ev.preventDefault();
      openDetail(id);
      break;

    case 'tag':
      ev.preventDefault();
      state.tag = el.dataset.tag;
      closeDrawer();
      switchView('tag');
      break;

    /* 概览「近 7 日」点某天 → 当天入库清单 */
    case 'day':
      ev.preventDefault();
      state.listMode = { type:'day', date: el.dataset.date };
      switchView('list');
      break;

    /* 概览「最新入库」右侧「全部文章」→ 全库清单 */
    case 'all-articles':
      ev.preventDefault();
      state.listMode = { type:'all' };
      switchView('list');
      break;

    case 'close-drawer':
      closeDrawer();
      break;

    case 'refresh-stats':   renderOverview(); break;
    case 'reload-review':   renderReview(); break;
    case 'reload-cat':      renderCategory(el.dataset.cat); break;
    case 'reload-settings': renderSettings(); break;
    case 'reload-rules':    renderRules(); break;
    case 'save-rules':      saveRules(); break;

    /* 分类设置 */
    case 'save-cat': saveCategory(el.dataset.cat); break;
    case 'del-cat':  deleteCategory(el.dataset.cat); break;
    case 'add-cat':  addCategory(); break;

    case 'set-order':
      state.order = (el.dataset.order === 'asc') ? 'asc' : 'desc';
      try { localStorage.setItem('myrag_order', state.order); } catch(e){}
      if (state.view === 'tag')                  renderTag(state.tag);
      else if (state.view === 'review')          renderReview(false);
      else if (state.view === 'list')            renderArticleList();
      else if (state.view.indexOf('cat-') === 0) renderCategory(state.view.slice(4));
      break;

    case 'confirm-review':
      confirmReview(id);
      break;

    case 'setcat':
      setCategory(id, el.dataset.cat);
      break;

    case 'drawer-cat':
      if (state.detail && state.detail.category !== el.dataset.cat) setCategory(id, el.dataset.cat);
      break;

    case 'verify':
      verifyOne(id, el);
      break;

    case 'edit-meta':
      editMeta(id);
      break;

    case 'delete':
      delOne(id);
      break;

    case 'submit-text':
      submitText();
      break;

    case 'research':
      $('#q').value = el.dataset.q || '';
      $('#mode').value = el.dataset.mode || 'hybrid';
      doSearch(el.dataset.q, el.dataset.mode);
      break;

    case 'zoom': {
      $('#lightboxImg').src = el.dataset.src;
      $('#lightbox').classList.add('on');
      break;
    }
    case 'lightbox-close':
      $('#lightbox').classList.remove('on');
      break;
  }
});

$('#lightbox').addEventListener('click', () => $('#lightbox').classList.remove('on'));

// 类别分段按钮（补录页）
document.addEventListener('click', ev => {
  const b = ev.target.closest('#aCat button');
  if (!b) return;
  $$('#aCat button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
});

// 检索表单
$('#searchForm').addEventListener('submit', ev => {
  ev.preventDefault();
  doSearch($('#q').value, $('#mode').value);
});

// 快捷键：Esc 关抽屉/灯箱，/ 聚焦搜索
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape'){
    if ($('#lightbox').classList.contains('on')) $('#lightbox').classList.remove('on');
    else if ($('#drawer').classList.contains('on')) closeDrawer();
  }
  if (ev.key === '/' && document.activeElement === document.body){
    ev.preventDefault();
    $('#q').focus();
  }
});

/* ================================================================ 启动 */
(async function boot(){
  applyAppName();                // 顶栏名称（可能被用户改过）先落地，避免闪一下默认名
  try {
    await loadCategories();      // 分类是页签与视图的前提，必须最先拿到
  } catch(e){
    console.error(e);
    toast('分类配置加载失败：' + (e && e.message ? e.message : e), 4600);
  }
  loadHealth();
  switchView('overview');
  setInterval(loadHealth, 60000);
})();
</script>
</body>
