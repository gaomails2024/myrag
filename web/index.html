<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>个人知识库 · 工作台</title>
<style>
/* ============================================================ 配色（跟随系统，PRD §10.4） */
:root{
  /* 固定浅色：纸灰底 + 炭黑墨。
     用户明确要「浅色背景」，所以不再跟随系统深色模式（原来那套 dark 变量已移除）。 */
  color-scheme: light;
  --bg:#F0EFEB; --panel:#F0EFEB; --panel-2:#E8E6E0; --panel-3:#DEDDD6;
  --border:#DEDDD6; --border-2:#B0AFA9;
  --hair:#DEDDD6;              /* 发丝线：无边框分卡时的分隔线 */
  --card-surface:#F6F5F2;      /* 卡片底：比页面亮一档，避免同色发飘 */
  --side-w:196px;              /* 左侧导航宽度（见 .tabs）。窄屏会收窄，见文件末尾的 @media */
  --text:#1C1C1A; --text-2:#6A6963; --text-3:#8F8E88;
  --accent:#7E93A8; --accent-soft:#E7ECF0; --accent-line:#C3CDD5;
  /* 分类配色板：**莫兰迪色系**（低饱和、带灰调）。
     分类可增删，颜色按顺序取，不绑定具体分类名。 */
  --c0:#7E93A8; --c0-soft:#E7ECF0;   /* 雾霾蓝 */
  --c1:#7F9B87; --c1-soft:#E6EDE7;   /* 灰绿   */
  --c2:#9B8FA8; --c2-soft:#EDE9F0;   /* 藕紫   */
  --c3:#B98A6E; --c3-soft:#F2E8E1;   /* 陶土   */
  --c4:#7FA0A3; --c4-soft:#E5EEEE;   /* 灰青   */
  --c5:#BCAE7C; --c5-soft:#F1EEE1;   /* 芥黄   */
  /* 语义色：结论徽章用。**独立于分类色板** —— 语义不该跟着分类顺序变。
     比分类色深一档：「值得试」要当实心底，白字必须压得住。 */
  --ok:#5F7A68; --ok-soft:#E4EBE5;
  --warn:#8A7A4E; --warn-soft:#EFEBDE;
  --danger:#A0685A; --danger-soft:#F1E6E2;
  --shadow:none;
  --radius:16px; --radius-s:10px;
  /* hover 描边色：比 --border 清楚、比 --border-2 轻（border-2 反馈偏重） */
  --hover-line:#C9C7BD;
}

/* ============================================================ 基础 */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
       "Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  /* 给左侧固定导航让位：侧栏是 position:fixed（脱离文档流），
     由这里的 padding 撑出空间 —— 顶栏与 main 都在 padding 内，
     会自动从侧栏右侧开始，不必各自再加 margin。 */
  padding-left:var(--side-w);
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit; color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2); border-radius:6px; border:3px solid transparent; background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
svg{flex:none; display:block}
.ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ============================================================ 顶栏 */
.topbar{
  position:sticky; top:0; z-index:40; background:var(--panel);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:14px;
  padding:10px 18px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:8px; font-weight:650; letter-spacing:.2px; white-space:nowrap}
.brand .ico{width:18px;height:18px;color:var(--accent)}
.searchbox{
  flex:1 1 320px; min-width:240px; display:flex; align-items:center;
  background:var(--panel-2); border:1px solid var(--border);
  border-radius:var(--radius); padding:0 4px 0 10px; gap:6px; height:38px;
}
.searchbox:focus-within{border-color:var(--accent-line); background:var(--panel)}
.searchbox .ico{color:var(--text-3)}
.searchbox input{
  flex:1; min-width:0; background:none; border:0; outline:none; height:100%;
}
.searchbox input::placeholder{color:var(--text-3)}
.searchbox select{
  background:var(--panel-3); border:1px solid var(--border); border-radius:var(--radius-s);
  height:28px; padding:0 6px; outline:none; color:var(--text-2); font-size:13px;
}
.btn{
  display:inline-flex; align-items:center; gap:6px; justify-content:center;
  height:30px; padding:0 12px; border-radius:var(--radius-s);
  border:1px solid var(--border-2); background:var(--panel); color:var(--text);
  cursor:pointer; white-space:nowrap; font-size:13px;
}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger); border-color:var(--border-2)}
.btn.danger:hover{background:var(--danger-soft); border-color:var(--danger)}
.btn.tiny{height:26px; padding:0 9px; font-size:12px}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.chips{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.chip{
  display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 9px;
  border-radius:99px; background:var(--panel-2); border:1px solid var(--border);
  color:var(--text-2); font-size:12px; white-space:nowrap;
}
.chip b{color:var(--text); font-weight:600}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.chip .dot.off{background:var(--warn)}

/* ============================================================ 左侧导航 */
/* 导航放在**左侧固定栏**，而不是顶部横条。
   起因：分类会随使用增长，横条一旦放不下就只能横向滚动，而滚动条是隐藏的
   （下面 .tabs::-webkit-scrollbar），等于把靠后的分类悄悄藏起来，
   既不提示有更多、也没法一眼看全。竖排天然可滚动，且给分类留的是**高度**。

   布局靠两半配合：侧栏 position:fixed 脱离文档流，由 body 的 padding-left 让位。 */
.tabs{
  position:fixed; left:0; top:0; bottom:0; width:var(--side-w);
  display:flex; flex-direction:column; align-items:stretch; gap:2px;
  padding:14px 10px; overflow-y:auto; overflow-x:hidden;
  background:var(--bg); border-right:1px solid var(--hair);
  z-index:35;
}
.tabs::-webkit-scrollbar{width:0}
/* 页签栏（= 左侧主目录）：文字**一直**是棕色，不加粗、无圆角框、
   悬停反白、任何状态都不带下划线（用户 2026-10-07 要求）。
   选中态只用左侧棕条标记，不用蓝底也不加粗。 */
.tab{
  display:flex; align-items:center; gap:8px; padding:9px 11px;
  border-radius:0; cursor:pointer; text-align:left;
  color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  background:none; border:0; font-size:13px; width:100%; font-weight:400;
  text-decoration:none;
  box-shadow:inset 2px 0 0 transparent;
  transition:color .16s cubic-bezier(.2,.7,.3,1), background .16s;
}
.tab:hover{color:var(--text); background:#fff}     /* 悬停反白 + 字加深 */
.tab:focus,.tab:active{outline:none}
.tab.on{color:var(--text); background:transparent; font-weight:400;
  box-shadow:inset 2px 0 0 var(--text-2)}          /* 选中：左侧灰褐竖条，不加粗不铺底 */
.tab .ico{opacity:.75}
.tab .ico{flex:none}
.tab .badge-n{margin-left:auto}
.tab .badge-n{
  background:var(--warn); color:#FFFDF8; border-radius:99px;
  padding:1px 7px; font-size:10.5px; font-weight:700; line-height:16px;
}

/* ============================================================ 布局 */
main{padding:24px 20px; max-width:1180px; margin:0 auto}
.view{display:none}
.view.on{display:block}
/* 区块标题：小号 + 字距，像杂志栏目名，不跟内容抢重量 */
.sec-head{display:flex; align-items:center; gap:10px; margin:0 0 16px; flex-wrap:wrap}
.sec-head h2{margin:0; font-size:12px; font-weight:700; letter-spacing:.08em;
  color:var(--text-3)}
.sec-head .sub{color:var(--text-3); font-size:12.5px}
.spacer{flex:1}
/* 分卡不靠边框与阴影，靠底色差一档 + 留白 */
.panel{
  background:var(--card-surface); border:0;
  border-radius:var(--radius); box-shadow:none;
}
.panel + .panel, .panel + .stack, .stack + .panel{margin-top:16px}
.panel-pad{padding:22px 24px}
.muted{color:var(--text-3)}
.empty{padding:34px 16px; text-align:center; color:var(--text-3)}

/* 概览卡片 */
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px}
.card{
  background:var(--card-surface); border:0; border-radius:var(--radius);
  padding:20px 22px; cursor:pointer; box-shadow:none; text-align:left;
  transition:box-shadow .18s cubic-bezier(.2,.7,.3,1);
}
/* 与其他卡片一致：hover 只描边，不改底色 */
.card:hover{box-shadow:inset 0 0 0 1px var(--hover-line)}
.card .k{display:flex; align-items:center; gap:6px; color:var(--text-3);
  font-size:11px; font-weight:700; letter-spacing:.08em}
/* 数字是主数据，给最大字重与最紧字距（明度/字重即层级） */
.card .v{font-size:34px; font-weight:800; line-height:1.15; margin:8px 0 2px;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.card .foot{color:var(--text-3); font-size:11.5px; margin-top:2px}
.card.c-warn .v{color:var(--warn)}

/* 趋势条 */
/* 概览：近 7 日入库 与 索引与占用 同行，宽度 6:4。
   窄屏回退成单列 —— 索引那几行文字在 40% 宽度下会折行折得很难看。 */
.dash2{display:grid; grid-template-columns:6fr 4fr; gap:14px; margin-top:16px}
.dash2 .panel + .panel{margin-top:0}   /* 同行时不该再叠面板间的垂直间距 */
/* 让趋势图吃掉左面板的剩余高度。不这样做的话，右面板更高时左边会在柱状图下方
   留一大块空白，看着像渲染坏了。min-height 保住柱子本身的可用高度。 */
.dash2 .panel:first-child{display:flex; flex-direction:column}
.dash2 .panel:first-child .trend{flex:1; height:auto; min-height:112px}
/* 紧跟 .dash2 的那个面板**不满足** `.panel + .panel`（它的前一个兄弟是 .dash2，
   不是 .panel），不补这条就会和上一行紧贴。 */
.dash2 + .panel{margin-top:16px}
@media (max-width:980px){ .dash2{grid-template-columns:1fr} }
/* 占用构成：横向堆叠条 —— 总长 = 总占用，各段宽度 = 各部分占比。
   比逐项列数字直观：**"配图占了绝大部分"这件事一眼就能看出来**。
   单位统一成 MB（见 toMB），否则混着 KB/MB 没法横向比长度。 */
.usage{display:flex; height:14px; border-radius:7px; overflow:hidden;
       background:var(--panel-2); margin:3px 0 9px}
.usage i{display:block; min-width:3px}   /* 占比极小的部分也要看得见，否则像缺失 */
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--text-2)}
.legend span{display:inline-flex; align-items:center; gap:5px}
.legend .sw{width:9px; height:9px; border-radius:2px; flex:none}
.legend b{font-weight:600; color:var(--text)}
.legend em{font-style:normal; opacity:.65}
/* 最新入库：紧凑列表，一行一篇 */
.latest .li{display:flex; align-items:center; gap:10px; padding:8px 2px;
            border-top:1px solid var(--border); cursor:pointer}
.latest .li:first-child{border-top:0}
.latest .li:hover{background:var(--panel-2)}
.latest .li .ti{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
                white-space:nowrap; font-size:13.5px}
.latest .li .dt{flex:none; font-size:12px; color:var(--text-2)}
.trend{display:flex; align-items:flex-end; gap:10px; height:112px; padding:6px 2px 0}
.trend .col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; cursor:pointer; border-radius:6px}
.trend .col:hover .n{color:var(--accent)}
.trend .bar{
  width:100%; max-width:44px; min-height:4px; border-radius:99px 99px 3px 3px;
  background:var(--accent);   /* 石青色，与顶栏搜索按钮同色 */
}
.trend .bar.zero{background:var(--panel-3)}
.trend .n{font-size:12px; color:var(--text-2); font-variant-numeric:tabular-nums;
  font-weight:700}
.trend .d{font-size:10.5px; color:var(--text-3)}

/* 列表 */
.rows{display:flex; flex-direction:column}
.row{
  display:flex; gap:18px; align-items:flex-start; padding:22px 26px;
  border-bottom:1px solid var(--hair);
  transition:box-shadow .18s cubic-bezier(.2,.7,.3,1);
}
.row:last-child{border-bottom:0}
/* hover 只描一圈深色边框：不铺底色、也不改标题色（改色会让整行跳一下） */
.row:hover{box-shadow:inset 0 0 0 1px var(--hover-line)}
.row .grow{flex:1; min-width:0}
.row .t{
  font-size:15.5px; font-weight:700; letter-spacing:-.012em; line-height:1.5; margin:0 0 7px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.row .m{color:var(--text-3); font-size:11px; font-weight:500; letter-spacing:.02em;
  display:flex; gap:11px; flex-wrap:wrap; align-items:center}
.row .s{color:var(--text-2); font-size:13.5px; line-height:1.8; margin-top:9px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.row.clickable{cursor:pointer}
.row.clickable .t{color:var(--text)}
.row .acts{display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end}

/* 徽章：一律胶囊、无边框 */
.bdg{
  display:inline-flex; align-items:center; gap:4px; padding:3px 11px;
  border-radius:99px; font-size:11px; font-weight:600; white-space:nowrap;
  border:0;
}
.bdg.warn{background:var(--warn-soft); color:var(--warn)}
.bdg.ok{background:var(--ok-soft); color:var(--ok)}
.bdg.bad{background:var(--danger-soft); color:var(--danger)}
.bdg.ghost{background:var(--panel-2); color:var(--text-2)}
/* 结论徽章：「值得试」要一眼看见，其余两个保持低调（不值得的结论不该抢注意力） */
.bdg.vtry{background:var(--ok); color:#FFFDF8; font-weight:700}
.bdg.vtry::before{content:'✓'; margin-right:4px; font-weight:700}
.bdg.vwatch{background:var(--warn-soft); color:var(--warn)}
.bdg.vwatch::before{content:'·'; margin-right:4px}
.bdg.vdead{background:var(--danger-soft); color:var(--danger)}
.bdg.vdead::before{content:'✕'; margin-right:4px}
/* 卡片左侧色条：扫列表时不必逐个读徽章 */
.acard.v-try{border-left:2px solid var(--ok)}
.acard.v-watch{border-left:2px solid var(--warn)}
.acard.v-dead{border-left:2px solid var(--danger)}
.tagline{display:flex; gap:5px; flex-wrap:wrap; margin-top:8px}
.tag{
  font-size:11px; color:var(--text-2); background:var(--panel-2);
  border:0; border-radius:99px; padding:3px 11px;
}
.tag.link{cursor:pointer}
.tag.link:hover{color:var(--accent)}

/* ============================================================ 关于弹窗（点左上角名称打开） */
.brand{cursor:pointer}
.brand:hover span{color:var(--accent)}
.about{
  position:fixed; inset:0; z-index:80;
  display:flex; align-items:center; justify-content:center; padding:20px;
  background:rgba(28,28,26,.34);
  opacity:0; pointer-events:none; transition:opacity .18s ease;
}
.about.on{opacity:1; pointer-events:auto}
.about-card{
  width:min(430px,100%); max-height:86vh; overflow:auto;
  background:var(--card-surface); border-radius:var(--radius);
  padding:26px 28px 22px; box-shadow:0 20px 55px rgba(28,28,26,.24);
  transform:translateY(10px);
  transition:transform .2s cubic-bezier(.2,.7,.3,1);
}
.about.on .about-card{transform:none}
.about-card h3{margin:0 0 4px; font-size:16px; font-weight:700; letter-spacing:-.015em}
.about-card .sub{color:var(--text-3); font-size:12px; margin-bottom:20px}
.about-card .rowline{display:flex; gap:12px; align-items:baseline;
  padding:11px 0; border-bottom:1px solid var(--hair); font-size:13px}
.about-card .rowline:last-of-type{border-bottom:0}
.about-card .rowline .k{color:var(--text-3); font-size:10px; font-weight:700;
  letter-spacing:.09em; text-transform:uppercase; width:66px; flex:none}
.about-card .rowline .v{color:var(--text); word-break:break-all; line-height:1.6}
.about-card .namein{display:flex; gap:8px}
.about-card .namein .inp{flex:1}
.about-card .hintline{color:var(--text-3); font-size:11.5px; margin-top:7px; line-height:1.6}
.about-card .acts2{display:flex; gap:9px; margin-top:22px}

/* 应用类卡片网格 */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
.acard{
  background:var(--card-surface); border:0; border-radius:var(--radius);
  padding:22px 24px 20px; box-shadow:none; cursor:pointer;
  display:flex; flex-direction:column; gap:13px;
  border-left:2px solid transparent;
  transition:background .18s cubic-bezier(.2,.7,.3,1);
}
/* hover 只描一圈深色边框，不改底色 —— 整片变深太重，会把卡片压死 */
.acard:hover{box-shadow:inset 0 0 0 1px var(--hover-line)}
.acard .t{font-size:15.5px; font-weight:700; letter-spacing:-.012em; line-height:1.5;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
/* 键值对：标签退成「来源行」（小号 + 字距），值升为主墨色 */
.acard .kv{display:grid; grid-template-columns:auto 1fr; gap:8px 14px}
.acard .kv .k{color:var(--text-3); font-size:10px; font-weight:700;
  letter-spacing:.09em; padding-top:3px}
.acard .kv .v{color:var(--text); font-size:13px; line-height:1.5; word-break:break-all}
.acard .kv .v.num{font-weight:800; font-variant-numeric:tabular-nums;
  font-size:14.5px; letter-spacing:-.015em}
.acard .top{display:flex; align-items:center; gap:8px; justify-content:space-between}
/* 核查状态：小号大写字距（同「来源行」） */
.acard .foot{font-size:10px; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:var(--text-3); margin-top:auto}

/* 表单 */
.form{display:grid; gap:12px}
.field{display:grid; gap:6px}
.field > label{font-size:12.5px; color:var(--text-2)}
.inp, .ta, .sel{
  width:100%; background:var(--panel-2); border:1px solid var(--border);
  border-radius:var(--radius-s); padding:8px 10px; outline:none;
}
.inp:focus,.ta:focus,.sel:focus{border-color:var(--accent-line); background:var(--panel)}
.ta{resize:vertical; min-height:220px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; line-height:1.65}
.seg{display:inline-flex; background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius-s); padding:2px; gap:2px}
.seg button{
  border:0; background:none; padding:4px 12px; border-radius:5px; cursor:pointer;
  color:var(--text-2); font-size:13px;
}
.seg button.on{background:var(--panel); color:var(--text); font-weight:600; box-shadow:var(--shadow)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:640px){ .row2{grid-template-columns:1fr} }

/* ============================================================ 详情抽屉 */
.scrim{
  position:fixed; inset:0; background:rgba(10,12,16,.42); z-index:60;
  opacity:0; pointer-events:none; transition:opacity .18s ease;
}
.scrim.on{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:min(760px,100%); z-index:61;
  background:var(--bg); border-left:1px solid var(--hair);
  transform:translateX(102%); transition:transform .22s cubic-bezier(.3,.8,.3,1);
  display:flex; flex-direction:column;
}
.drawer.on{transform:none}
.dhead{
  padding:18px 22px; border-bottom:1px solid var(--hair); background:var(--bg);
  display:flex; gap:10px; align-items:flex-start;
}
.dhead .t{font-size:17px; font-weight:700; letter-spacing:-.012em; line-height:1.45; margin:0}
.dhead .m{color:var(--text-3); font-size:11px; letter-spacing:.02em; margin-top:6px;
  display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.dbody{flex:1; overflow:auto; padding:20px}
.dfoot{
  border-top:1px solid var(--hair); background:var(--bg); padding:12px 22px;
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
}
.block{background:var(--card-surface); border:0; border-radius:var(--radius); padding:22px 24px; margin-bottom:14px}
.block h3{margin:0 0 10px; font-size:13px; font-weight:650; color:var(--text-2); letter-spacing:.3px}
.kvgrid{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13px}
.kvgrid .k{color:var(--text-3)}
.kvgrid .v{word-break:break-word}
.thumbs{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:9px}
.thumbs img{
  width:100%; height:112px; object-fit:cover; border-radius:var(--radius-s);
  border:1px solid var(--border); background:var(--panel-2); cursor:zoom-in;
}
/* Markdown 正文 */
.md{font-size:14.5px; line-height:1.85; word-wrap:break-word}
.md > :first-child{margin-top:0}
.md h1{font-size:20px; margin:26px 0 12px; line-height:1.4}
.md h2{font-size:17.5px; margin:24px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--border); line-height:1.4}
.md h3{font-size:15.5px; margin:20px 0 8px}
.md h4{font-size:14.5px; margin:16px 0 6px; color:var(--text-2)}
.md p{margin:11px 0}
.md img{max-width:100%; height:auto; border-radius:var(--radius-s); border:1px solid var(--border); margin:12px 0; background:var(--panel-2)}
.md ul,.md ol{padding-left:22px; margin:11px 0}
.md li{margin:5px 0}
.md blockquote{
  margin:12px 0; padding:8px 14px; border-left:3px solid var(--accent-line);
  background:var(--panel); border-radius:0 var(--radius-s) var(--radius-s) 0; color:var(--text-2);
}
.md code{
  background:var(--panel-3); padding:1.5px 5px; border-radius:4px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px;
}
.md pre{background:var(--panel-3); padding:12px; border-radius:var(--radius-s); overflow:auto; border:1px solid var(--border)}
.md pre code{background:none; padding:0}
.md table{border-collapse:collapse; width:100%; margin:12px 0; font-size:13px; display:block; overflow:auto}
.md th,.md td{border:1px solid var(--border); padding:6px 10px; text-align:left}
.md th{background:var(--panel-2); font-weight:600}
.md hr{border:0; border-top:1px solid var(--border); margin:20px 0}
.md a{word-break:break-all}
.chunkitem{border:1px solid var(--border); border-radius:var(--radius-s); margin-bottom:8px; background:var(--panel-2)}
.chunkitem summary{cursor:pointer; padding:8px 11px; font-size:12.5px; color:var(--text-2); display:flex; gap:8px; align-items:center}
.chunkitem summary::-webkit-details-marker{display:none}
.chunkitem .ctext{padding:0 11px 11px; font-size:13px; color:var(--text-2); white-space:pre-wrap; line-height:1.75; border-top:1px solid var(--border); padding-top:10px; margin-top:2px}

/* ---- 详情：按信息价值分层 ---- */
/* 摘要：人最该先看到的东西，字号给足 */
.sum{font-size:15px; line-height:1.9; color:var(--text)}
.sum em{font-style:normal; color:var(--text-3)}
/* 项目实况：仓库/star/license 一行扫完，次要信息降为灰字一行 */
.repo-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.repo-head .name{font-size:15px; font-weight:600}
.repo-sub{color:var(--text-3); font-size:12.5px; margin-top:7px; display:flex; gap:12px; flex-wrap:wrap}
/* 真正要读的两项：能力边界 / 部署条件 */
.repo-key{display:grid; grid-template-columns:auto 1fr; gap:9px 14px; margin-top:13px; font-size:13.5px}
.repo-key .k{color:var(--text-3); white-space:nowrap}
.repo-key .v{line-height:1.8; word-break:break-word}
/* 备查信息：编号/底本/时间戳这类，默认收起 */
details.spare{
  border:1px solid var(--border); border-radius:var(--radius);
  background:var(--panel); margin-bottom:14px;
}
details.spare > summary{
  cursor:pointer; padding:11px 14px; font-size:13px; color:var(--text-3);
  list-style:none; display:flex; align-items:center; gap:7px;
}
details.spare > summary::-webkit-details-marker{display:none}
details.spare > summary::before{content:'▸'; font-size:11px; transition:transform .15s ease}
details.spare[open] > summary::before{transform:rotate(90deg)}
details.spare .inner{padding:2px 14px 14px; border-top:1px solid var(--border); margin-top:2px; padding-top:12px}
details.spare .kvgrid{font-size:12.5px}
/* 标签按钮的"当前筛选"态 */
.tag.on{background:var(--accent-soft); color:var(--accent); border-color:var(--accent-line)}

/* 检索命中 */
.hit{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:11px; box-shadow:var(--shadow)}
.hit .hh{display:flex; gap:9px; align-items:baseline; flex-wrap:wrap}
.hit .ht{font-size:14.5px; font-weight:600; line-height:1.45}
.hit .score{color:var(--text-3); font-size:12px; font-variant-numeric:tabular-nums; margin-left:auto}
.hit .hm{color:var(--text-3); font-size:12.5px; margin-top:4px}
.mc{margin-top:10px; border-top:1px dashed var(--border); padding-top:9px; display:grid; gap:9px}
.mc .mp{font-size:12px; color:var(--accent); margin-bottom:3px}
.mc .mt{font-size:13px; color:var(--text-2); line-height:1.7}
.mc .mr{font-size:11.5px; color:var(--text-3); margin-top:3px; display:flex; gap:10px}

/* 灯箱 */
.lightbox{
  position:fixed; inset:0; z-index:80; background:rgba(6,8,11,.9);
  display:none; align-items:center; justify-content:center; padding:28px; cursor:zoom-out;
}
.lightbox.on{display:flex}
.lightbox img{max-width:100%; max-height:100%; border-radius:6px}

/* 提示条 */
.banner{
  display:flex; gap:9px; align-items:flex-start; padding:11px 14px; border-radius:var(--radius);
  background:var(--danger-soft); color:var(--danger); border:1px solid var(--danger-soft);
  margin-bottom:16px; font-size:13px;
}
.banner code{background:rgba(0,0,0,.08); padding:1px 5px; border-radius:4px}
/* 说明型提示条：淡白底，与页面大背景同系，不抢注意力（区别于红底的错误提示） */
.banner.tip{background:var(--card-surface); color:var(--text-2); border-color:transparent}
#toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
  background:var(--text); color:var(--bg); padding:9px 16px; border-radius:99px;
  font-size:13px; opacity:0; pointer-events:none; transition:all .2s ease; z-index:90;
  max-width:min(560px,92vw); text-align:center;
}
#toast.on{opacity:1; transform:translateX(-50%)}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 窄屏降级：侧栏收窄。分类再多也仍是**竖排可滚动**（这正是改成侧栏的目的），
   只是更省横向空间。（放文件末尾以覆盖上面的 .tab 定义） */
@media (max-width:820px){
  :root{--side-w:132px}
  .tab{font-size:12px; padding:8px 9px; gap:6px}
  .tab .muted{display:none}   /* 小屏先让位的是计数，分类名更重要 */
}

/* ---- 模块 9/10：逻辑主题树 + 标签词云 ----
   配色一律取上面的莫兰迪色板（--c0..--c5）与纸灰底，不另起一套视觉：
   早先独立页用了高饱和蓝绿橙，跟工作台并排看就是两套产品。 */
.tw2{display:flex;gap:18px;align-items:flex-start}
.tw2-side{width:250px;flex:0 0 250px;position:sticky;top:64px}
.tw2-main{flex:1;min-width:0}
.tw2-find{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-s);
  background:var(--card-surface);font:inherit;font-size:13px;color:var(--text);margin-bottom:10px}
.tw2-nav{border:1px solid var(--border);border-radius:var(--radius);padding:8px 6px;
  background:var(--card-surface);max-height:calc(100vh - 190px);overflow-y:auto}
.tw2-n{margin:1px 0}
.tw2-n>a{align-items:center}
/* 折叠标记：+ / −（原为 ▸/▾，用户要求改成加减号）。字号 17px —— 符号的视觉面积
   比三角小，得补一档才看得清；热区再用伪元素向外扩 8px（用户两次反馈「太小、
   必须精确点中」）。 */
.tw2-tw{display:inline-flex;align-items:center;justify-content:center;position:relative;
  width:22px;height:22px;font-size:17px;font-weight:600;line-height:1;color:var(--text-3);
  cursor:pointer;flex:0 0 22px;border-radius:0}
.tw2-tw::before{content:'';position:absolute;left:-8px;right:-8px;top:-9px;bottom:-9px}
.tw2-tw:hover{color:var(--text);background:#fff}
.tw2-tw.leaf{cursor:default}
.tw2-tw.leaf::before{display:none}
.tw2-tw.open{color:var(--text-2)}
/* 左侧树：一律不加粗、无圆角、棕字、悬停反白、不带下划线；
   当前节点也不铺蓝底，只用左侧棕色竖条标记（用户 2026-10-07） */
.tw2-row{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:0;
  color:var(--text-2);text-decoration:none;font-size:13px;font-weight:400;
  box-shadow:inset 2px 0 0 transparent}
.tw2-row:hover{background:#fff;color:var(--text);text-decoration:none}
.tw2-row:focus,.tw2-row:active{outline:none;text-decoration:none}
.tw2-n[style*="--d:0"]>.tw2-row{font-weight:400;font-size:13px}
.tw2-n[style*="--d:1"]>.tw2-row{font-weight:400}
/* 层级靠三件事说清楚：缩进线、圆点大小/颜色、字重 */
.tw2-kids{margin-left:12px;padding-left:4px}   /* 原先有 border-left 竖线，已按要求去掉 */
.tw2-n.on>.tw2-row{background:transparent;color:var(--text);
  box-shadow:inset 2px 0 0 var(--text-2)}   /* 当前节点：深字 + 左侧灰褐竖条 */
.tw2-n.on>.tw2-row:hover{color:var(--text)}
.tw2-n.on>.tw2-row .tw2-c{color:var(--text-2)}
.tw2-n[data-tname] > .tw2-row > .tw2-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw2-n[style*="--d:0"] > a{font-weight:600;font-size:13.5px}
.tw2-n[style*="--d:1"] > a{font-weight:500}
.tw2-n.inpath > .tw2-row{color:var(--text-2)}
.tw2-n.on > .tw2-row{background:transparent}

.tw2-c{font-size:11px;color:var(--text-3);flex:0 0 auto;min-width:22px;text-align:right}
.crumb2{font-size:12.5px;color:var(--text-3);margin-bottom:6px}
.crumb2 b{font-weight:400;color:var(--text)}
.crumb2 a{color:var(--text-2);text-decoration:none}
.crumb2 a:hover{text-decoration:none;color:var(--text)}
.crumb2 span{margin:0 5px;color:var(--border-2)}
.tw2-h{margin:0 0 6px;font-size:21px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tw2-tag{font-size:12px;font-weight:400;color:var(--text-3);background:var(--panel-2);
  padding:2px 8px;border-radius:20px}
.tw2-sum{margin:0 0 10px;color:var(--text-2);max-width:820px;font-size:13.5px}
.tw2-subs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));margin:14px 0 6px}
.tw2-card{background:var(--card-surface);border:1px solid var(--border);border-radius:0;
  padding:11px 13px;cursor:pointer;transition:border-color .12s}
.tw2-card:hover{border-color:var(--hover-line)}
.tw2-card.c1{border-left:3px solid var(--c0)}
.tw2-card.c2{border-left:3px solid var(--c1)}
.tw2-card.c3{border-left:3px solid var(--c2)}
.tw2-cn{font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.tw2-cc{font-size:11.5px;color:var(--text-3);font-weight:400;flex:0 0 auto}
.tw2-cs{font-size:12.5px;color:var(--text-2);margin-top:3px}
.tw2-unm{margin:16px 0;padding:11px 13px;background:var(--warn-soft);border:1px solid var(--border);
  border-radius:var(--radius-s);font-size:12.5px;color:var(--text-2)}
.tw2-unm b{color:var(--text);margin-right:8px}
.tw2-unm>div{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px}
.tw2-unm a{font-size:12px;color:var(--text);background:var(--card-surface);
  border:1px solid var(--border);border-radius:20px;padding:2px 9px;text-decoration:none}
.tw2-unm a:hover{border-color:var(--hover-line)}
.tw2-ah{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);margin:18px 0 7px}
.tw2-ah span{color:var(--text-3);font-size:11.5px}
.tw2-ah .seg{margin-left:auto}
.tw2-ah .seg+.seg{margin-left:0}
.tw2-tb{width:100%;border-collapse:collapse;background:var(--card-surface);
  border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.tw2-tb th{font-size:11.5px;color:var(--text-3);text-align:left;font-weight:500;padding:8px 12px;
  border-bottom:1px solid var(--border);background:var(--panel-2)}
.tw2-tb td{padding:8px 12px;border-bottom:1px solid var(--hair);font-size:13px;vertical-align:top}
.tw2-tb tr:last-child td{border-bottom:none}
.tw2-tb tr:hover td{background:var(--panel-2)}
.ta-t a{color:var(--text);text-decoration:none;font-weight:500}
.ta-t a:hover{text-decoration:underline}
.ta-sub{font-size:10.5px;color:var(--text-3);border:1px solid var(--border);border-radius:4px;
  padding:0 5px;margin-left:7px;white-space:nowrap}
.ta-m,.ta-d{color:var(--text-3);font-size:11.5px;white-space:nowrap}
.ta-s{color:var(--text-3);font-size:11.5px;text-align:right;white-space:nowrap}
.cl-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.cl-meta{font-size:12.5px;color:var(--text-2)}
.cl-meta b{color:var(--text)}
.cl-ctl{display:flex;align-items:center;gap:5px;margin-left:auto;flex-wrap:wrap}
/* 分类筛选 / 词数切换：字比工作台默认的 .seg 小一号（用户 2026-10-07 要求） */
/* 注意选择器：分类/词数按钮本身就是 .seg（不是 .seg 里的 button） */
.cl-ctl button.seg{font-size:12px;padding:3px 9px;border-radius:5px}
.cl-meta{font-size:12px}
.cl-sep{width:1px;height:16px;background:var(--border);margin:0 3px}
.cl-hint{font-size:12.5px;color:var(--text-2);background:var(--card-surface);
  border:1px solid var(--border);border-radius:var(--radius-s);padding:9px 12px;margin-bottom:12px}
.cl-wrap{display:flex;gap:16px;align-items:flex-start}
.cl-wrap canvas{flex:1;min-width:0;background:var(--card-surface);border:1px solid var(--border);
  border-radius:var(--radius)}
.cl-side{width:300px;flex:0 0 300px;background:var(--card-surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 14px;max-height:520px;overflow-y:auto}
.cl-sh{margin:0 0 3px;font-size:16px;display:flex;align-items:baseline;gap:8px}
.cl-sh span{font-size:11.5px;color:var(--text-3);font-weight:400}
.cl-sd{margin-bottom:9px}
.cl-a{padding:7px 0;border-bottom:1px solid var(--hair);cursor:pointer}
.cl-a:last-child{border-bottom:none}
.cl-at{font-size:12.5px}
.cl-a:hover .cl-at{text-decoration:underline}
.cl-am{font-size:11px;color:var(--text-3);margin-top:1px}

/* ---- 模块 11：术语归并 ---- */
.tm-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.tm-meta{font-size:13px;color:var(--text-2)}
.tm-meta b{color:var(--text)}
.tm-bar .btn{margin-left:0}
.tm-bar .btn.primary{margin-left:auto}
.tm-prev{font-size:12.5px;color:var(--text-2);background:var(--card-surface);
  border:1px solid var(--border);border-radius:var(--radius-s);padding:9px 12px;margin-bottom:14px}
.tm-prev b{color:var(--text)}
.tm-warn{margin:0 0 14px;padding:9px 12px;background:var(--warn-soft);
  border:1px solid var(--border);border-radius:var(--radius-s);font-size:12.5px}
.tm-sec{margin-bottom:20px}
.tm-sh{display:flex;align-items:baseline;gap:10px;font-size:13.5px;font-weight:600;
  padding-bottom:7px;border-bottom:1px solid var(--border);margin-bottom:9px}
.tm-sh span{margin-left:auto;font-size:11.5px;font-weight:400;color:var(--text-3)}
.tm-rows{display:flex;flex-direction:column;gap:4px}
.tm-item,.tm-row{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:8px;
  background:var(--card-surface);border:1px solid var(--border);font-size:13px;cursor:pointer}
.tm-item:hover{border-color:var(--hover-line)}
.tm-item.on{border-color:var(--c1);background:var(--c1-soft)}
.tm-item input,.tm-tag input{margin:0;flex:0 0 auto}
.tm-cn{font-weight:600;min-width:120px;max-width:260px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;padding:1px 3px;border-radius:4px}
.tm-cn[contenteditable]:hover{background:var(--panel-2)}
.tm-cn[contenteditable]:focus{outline:1px solid var(--accent-line);background:var(--panel-2)}
.tm-ar{color:var(--text-3);flex:0 0 auto}
.tm-al{color:var(--text-2);background:var(--panel-2);border-radius:5px;padding:1px 7px;
  font-size:12px;display:inline-flex;gap:4px;align-items:center}
.tm-al i,.tm-tag i{font-style:normal;font-size:10.5px;color:var(--text-3)}
.tm-sim{margin-left:auto;font-size:11px;color:var(--text-3);flex:0 0 auto}
.tm-fam{margin-bottom:12px}
.tm-fn{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-2);margin-bottom:6px}
.tm-fn .btn{margin-left:auto;font-size:11.5px;padding:3px 9px}
.tm-tags{display:flex;flex-wrap:wrap;gap:5px}
.tm-tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;
  border-radius:20px;background:var(--card-surface);border:1px solid var(--border);cursor:pointer}
.tm-tag.on{background:var(--c1-soft);border-color:var(--c1)}
@media (max-width:1100px){
  .tw2,.cl-wrap{flex-direction:column}
  .tw2-side,.cl-side{width:100%;flex:1 1 auto}
  .tw2-nav{max-height:260px}
}
</style>
</head>

<header class="topbar">

    <svg class="ico" viewBox="0 0 24 24"><path d="M4 4.5h5.5A2.5 2.5 0 0 1 12 7v13a2.5 2.5 0 0 0-2.5-2.5H4z"/><path d="M20 4.5h-5.5A2.5 2.5 0 0 0 12 7v13a2.5 2.5 0 0 1 2.5-2.5H20z"/></svg>

<!-- ============================================================ 页签 -->
<nav class="tabs" id="tabs">
  <button class="tab on" data-act="tab" data-view="overview">
    <svg class="ico" viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 8h6V4h-6z"/></svg>概览

<script>
/* ================================================================
   MyRag 工作台（PRD §10）
   - 单文件、内联 CSS/JS、无构建、无外部 CDN
   - 只读/写本地后端；后端不抓取、不调 LLM，本页也不做这两件事
   ================================================================ */

/* ---- 后端地址：留空 = 同源 ----
   页面本身就是后端发出来的，同源调用最稳：换端口、换主机都自动跟随，不用改前端。
   只有把页面单独托管到别处时，才需要填完整地址，如 'http://127.0.0.1:8765'。 */
const API_BASE = '';

const VERDICT = {
  try:   { t:'建议试试', c:'vtry' },
  watch: { t:'建议观望', c:'vwatch' },
  dead:  { t:'建议放弃', c:'vdead' }
};

/* 分类不写死：启动时从 /api/categories 拉取存进 state.cats。
   页签、徽章、视图、改类按钮、补录选项、判类标准全部由它驱动 —— */
const state = {
  view:'overview',
  cats:[],            // [{key,name,prefix,criteria,retrieval,features,is_default,sort_order,count}]
  catMap:{},          // key → 分类对象
  sub:{},             // 分类视图内的子页签（目前只有 concepts 用）
  search:{ q:'', mode:'hybrid' },
  tag:null,           // 正在按标签筛选的词
  listMode:null,      // 文章清单页模式：{type:'all'} 或 {type:'day', date:'YYYY-MM-DD'}
  // 列表排序：'desc' = 入库时间最新在前（默认），'asc' = 最早在前。
  // 存在 localStorage 里，刷新后保持用户的选择。
  order:(function(){ try { return localStorage.getItem('myrag_order') || 'desc'; }
                      catch(e){ return 'desc'; } })(),
  stats:null,
  detail:null,
  // 以下三项由 loadCategories() 从 /api/categories 填充
  retrievalModes:[],
  featureDefs:[],
  displayModes:[]
};

/* ================================================================ 工具 */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));

function esc(v){
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function attr(v){ return esc(v).replace(/"/g,'&quot;'); }

function d10(s){ return s ? String(s).slice(0,10) : ''; }
function dt(s){
  if (!s) return '';
  return String(s).replace('T',' ').slice(0,16);
}
function bytes(n){
  n = Number(n) || 0;
  const u = ['B','KB','MB','GB']; let i = 0;
  while (n >= 1024 && i < u.length-1){ n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(1)) + ' ' + u[i];
}
/* 固定用 MB。占用构成要**横向比长度**，混着 KB/MB 就没法比（见 .usage 说明）。*/
function toMB(n){ return ((Number(n) || 0) / 1048576).toFixed(1) + ' MB'; }
/* ---- 分类辅助（全部读 state.cats，无写死分类名）---- */
function catOf(k){ return state.catMap[k] || null; }
function catName(k){ const c = catOf(k); return c ? c.name : k; }
function catIndex(k){
  let i = state.cats.findIndex(c => c.key === k);
  return (i < 0 ? 0 : i) % 6;
}
function hasFeature(k, f){ const c = catOf(k); return !!(c && (c.features || []).includes(f)); }
function isRagCat(k){ const c = catOf(k); return !c || c.retrieval !== 'fulltext'; }
function catFoot(c){
  const bits = [];
  if ((c.features || []).includes('repo_card')) bits.push('GitHub 核查');
  if ((c.features || []).includes('concepts'))  bits.push('概念互链');
  bits.push(c.retrieval === 'fulltext' ? '不建索引' : 'RAG 检索');
  return bits.join(' · ');
}
function catBadge(c){
  const i = catIndex(c);
  /* 文字色 = 莫兰迪色与墨色混合。莫兰迪色本身偏淡，直接当文字色对比度不够；
     混入墨色后既保留色相、又压得住底。 */
  return `<span class="bdg" style="background:var(--c${i}-soft);` +
         `color:color-mix(in srgb, var(--c${i}) 62%, #1C1C1A)">${esc(catName(c))}</span>`;
}
function verdictBadge(v){
  const d = VERDICT[v];
  if (!d) return '<span class="bdg ghost">暂无建议</span>';
  return `<span class="bdg ${d.c}">${d.t}</span>`;
}
function delta(n){
  const s = String(n);
  return `<span class="chip"><b>${s}</b></span>`;
}

/* ================================================================ 应用名（顶栏显示名） */
/* 存 localStorage：改的是「这台机器这个浏览器」的显示名，不动数据、不动分类。
   想让它跨浏览器/跨设备一致，得挪到后端配置里去（现在没必要）。 */
const APP_NAME_DEFAULT = '个人知识库';
const APP_NAME_KEY = 'myrag_app_name';

function appName(){
  try { return localStorage.getItem(APP_NAME_KEY) || APP_NAME_DEFAULT; }
  catch(e){ return APP_NAME_DEFAULT; }
}
function applyAppName(){
  const n = appName();
  const el = $('#brandName');
  if (el) el.textContent = n;
  document.title = n + ' · 工作台';
}
function saveAppName(v){
  v = (v || '').trim().slice(0, 20);
  try {
    if (!v || v === APP_NAME_DEFAULT) localStorage.removeItem(APP_NAME_KEY);
    else localStorage.setItem(APP_NAME_KEY, v);
  } catch(e){ /* 隐私模式下 localStorage 可能不可写，忽略即可 */ }
  applyAppName();
  return appName();
}

/* ================================================================ 关于弹窗 */
/* 发布后把仓库地址填这里，弹窗里的「仓库」就会变成可点链接。 */
const REPO_URL = 'https://github.com/gaomails2024/myrag';

async function openAbout(){
  const box = $('#aboutBox');
  if (!box) return;
  $('#aboutName').value = appName();

  const repo = $('#aboutRepo');
  repo.innerHTML = REPO_URL
    ? `<a href="${attr(REPO_URL)}" target="_blank" rel="noopener">${esc(REPO_URL)}</a>`
    : '尚未发布';

  $('#aboutVer').textContent = '读取中…';
  try {
    const h = await apiGet('/api/health');
    $('#aboutVer').textContent = 'v' + (h.version || '?');
  } catch(e){
    $('#aboutVer').textContent = '后端未连接';
  }
  box.classList.add('on');
  setTimeout(() => { const i = $('#aboutName'); if (i) i.focus(); }, 60);
}
function closeAbout(){
  const box = $('#aboutBox');
  if (box) box.classList.remove('on');
}
/* 点遮罩关闭、点卡片内部不关。
   **不能用 data-stop** —— 事件委托里 `el.closest('[data-stop]')` 会直接 return，
   那会连卡片里的「保存」按钮一起拦掉（已踩过）。 */
(function bindAboutScrim(){
  const box = $('#aboutBox');
  if (!box) return;
  box.addEventListener('click', ev => {
    if (ev.target.closest('.about-card')) return;
    closeAbout();
  });
})();

/* ---- 网络 ---- */
async function api(path, opts){
  const res = await fetch(API_BASE + path, opts);
  let body = null;
  const txt = await res.text();
  try { body = txt ? JSON.parse(txt) : null; } catch(e){ body = { raw: txt }; }
  if (!res.ok && !(body && body.dup)) {
    const detail = body && body.detail
      ? (typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail))
      : ('HTTP ' + res.status);
    throw new Error(detail);
  }
  return body;
}
const apiGet  = p => api(p);
const apiJson = (p, method, body) => api(p, {
  method, headers:{ 'Content-Type':'application/json' },
  body: body === undefined ? undefined : JSON.stringify(body)
});

/* ---- 提示 ---- */
let toastTimer = null;
function toast(msg, ms){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), ms || 2600);
}
function showErr(e){ toast('失败：' + (e && e.message ? e.message : e), 4200); console.error(e); }

/* ================================================================ 顶栏统计 + 离线提示 */
async function loadHealth(){
  try {
    const h = await apiGet('/api/health');
    const ok = !!h.model_ready;
    $('#topStats').innerHTML =
      `<span class="chip"><span class="dot ${ok?'':'off'}"></span>${ok?'模型就绪':'模型加载中'}</span>` +
      `<span class="chip">v${esc(h.version)}</span>`;
    $('#offline').hidden = true;
  } catch(e){
    $('#offline').hidden = false;
    $('#offline').innerHTML =
      `<div class="banner">
        <svg class="ico" viewBox="0 0 24 24"><path d="M12 3.5 21 19H3z"/><path d="M12 9.5v4M12 16.2v.3"/></svg>
        <div><b>连不上本地后端</b>（${esc(location.origin)}）。请在<b>项目根目录</b>执行：
        <code>bash scripts/start.sh</code>，然后刷新本页。</div>
      </div>`;
    $('#topStats').innerHTML = `<span class="chip"><span class="dot off"></span>后端离线</span>`;
  }
}

/* ================================================================ 分类装载与页签（动态） */
/* 分类可增删，页签与视图容器都不能写死在 HTML 里，一律按 /api/categories 生成。 */
async function loadCategories(){
  const r = await apiGet('/api/categories');
  state.cats = r.items || [];
  state.catMap = {};
  state.cats.forEach(c => { state.catMap[c.key] = c; });
  state.retrievalModes = r.retrieval_modes || [];
  state.featureDefs = r.features || [];
  state.displayModes = r.display_modes || [];
  renderTabs();
}

const TAB_ICON = '<svg class="ico" viewBox="0 0 24 24">' +
  '<path d="M4 7.5 12 4l8 3.5-8 3.5z"/><path d="M4 12.5 12 16l8-3.5M4 16.5 12 20l8-3.5"/></svg>';

function renderTabs(){
  const nav = $('#tabs');
  const main = $('main');
  $$('.tab[data-cat-tab]', nav).forEach(el => el.remove());
  $$('section[data-cat-view]', main).forEach(el => el.remove());

  const searchTab = $('#tabSearch');
  const addView = $('#view-add');

  state.cats.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.dataset.act = 'tab';
    btn.dataset.view = 'cat-' + c.key;
    btn.dataset.catTab = '1';
    btn.innerHTML = TAB_ICON + esc(c.name) +
      ` <span class="muted" style="font-size:11.5px">${c.count || 0}</span>`;
    nav.insertBefore(btn, searchTab);

    const sec = document.createElement('section');
    sec.className = 'view';
    sec.id = 'view-cat-' + c.key;
    sec.dataset.catView = '1';
    main.insertBefore(sec, addView);
  });

  // 当前停留的分类被删掉时，退回概览，不留白屏
  if (state.view.indexOf('cat-') === 0 && !$('#view-' + state.view)) switchView('overview');
}

/* 排序切换：按入库时间「最新在前 / 最早在前」。
   所有列表（各分类、标签结果、待复核）共用同一个偏好，并记在 localStorage 里。 */
function orderSwitch(){
  return `<div class="seg" title="按入库时间排序">
    <button data-act="set-order" data-order="desc" class="${state.order === 'desc' ? 'on' : ''}">最新在前</button>
    <button data-act="set-order" data-order="asc" class="${state.order === 'asc' ? 'on' : ''}">最早在前</button>
  </div>`;
}
function orderArg(){
  return '&order=' + encodeURIComponent(state.order);
}

/* 展示样式：分类设置里显式指定；留空则按能力项自动推导（保持老行为） */
function displayOf(cat){
  if (cat && cat.display) return cat.display;
  if (cat && (cat.features || []).includes('repo_card')) return 'cards';
  return 'list';
}

function renderCategory(key){
  const cat = catOf(key);
  const box = $('#view-cat-' + key);
  if (!cat || !box) return;

  const d = displayOf(cat);
  if (d === 'cards')   return renderRepoCategory(key, box);
  if (d === 'compact') return renderCompactCategory(key, box);
  // 列表样式下，带「概念互链」能力的分类多给一个子页签
  if ((cat.features || []).includes('concepts')) return renderConceptCategory(key, box);
  return renderListCategory(key, box);
}

/* ---- 列表行的指标：随该分类的能力项变化，不写死分类名 ---- */
function catMetrics(a, cat){
  const feats = (cat && cat.features) || [];
  const bits = [];
  if (feats.includes('repo_card')){
    if (a.repo_url) bits.push(repoLabel(a.repo_url));
    if (a.stars != null) bits.push('★ ' + Number(a.stars).toLocaleString());
    if (a.license) bits.push(a.license);
  }
  if (feats.includes('concepts')){
    if (a.concept_count) bits.push(a.concept_count + ' 个概念');
    if (a.chunk_count) bits.push('切 ' + Math.max(0, a.chunk_count - 1) + ' 段');
  }
  if (cat && !isRagCat(cat.key)) bits.push('未建索引');
  return bits;
}

/* 列表行：标题 → 摘要 → 指标/元信息 → 标签（同一套层次，指标随分类变） */
function listRowHtml(a, cat){
  const metrics = catMetrics(a, cat);
  return `
    <div class="row clickable" data-act="detail" data-id="${attr(a.id)}">
      <div class="grow">
        <div class="t">${esc(a.title)}</div>
        ${a.summary ? `<div class="s">${esc(a.summary)}</div>` : ''}
        <div class="m">
          ${catBadge(cat.key)}
          ${a.review_flag ? '<span class="bdg warn">待复核</span>' : ''}
          ${metrics.map(x => `<span>${esc(x)}</span>`).join('')}
          <span>${esc(a.source || '来源未知')}</span>
          <span>${esc(d10(a.published_at || a.collected_at))}</span>
        </div>
        ${(a.tags && a.tags.length) ? `<div class="tagline">${a.tags.map(t =>
          `<span class="tag link" data-act="tag" data-tag="${attr(t)}" title="看所有带此标签的文章">${esc(t)}</span>`).join('')}</div>` : ''}
      </div>
      <div class="acts">
        <button class="btn tiny" data-act="detail" data-id="${attr(a.id)}">详情</button>
        ${a.url ? `<a class="btn tiny" href="${attr(a.url)}" target="_blank" rel="noopener" data-stop="1">原文</a>` : ''}
      </div>
    </div>`;
}

/* 紧凑行：只留标题与出处，适合量大的归档类 */
function compactRowHtml(a, cat){
  return `
    <div class="row clickable" data-act="detail" data-id="${attr(a.id)}">
      <div class="grow">
        <div class="t">${esc(a.title)}</div>
        <div class="m">
          ${catBadge(cat.key)}
          ${a.review_flag ? '<span class="bdg warn">待复核</span>' : ''}
          <span>${esc(a.source || '来源未知')}</span>
          <span>${esc(d10(a.published_at || a.collected_at))}</span>
        </div>
      </div>
    </div>`;
}

/* ================================================================ 模块 2：概览 */
async function renderOverview(){
  const box = $('#view-overview');
  box.innerHTML = `<div class="empty">加载中…</div>`;
  let s, latest;
  try {
    // 并行取：统计与最新列表互不依赖，串行会白等一个来回
    [s, latest] = await Promise.all([
      apiGet('/api/stats'),
      apiGet('/api/articles?order=desc&page_size=10'),
    ]);
  }
  catch(e){ box.innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`; return; }
  state.stats = s;

  const c = s.counts || {};
  const max = Math.max(1, ...(s.last7 || []).map(d => d.count));
  const trend = (s.last7 || []).map(d => `
    <div class="col" data-act="day" data-date="${attr(d.date)}" title="查看 ${esc(d.date)} 入库的 ${d.count} 条">
      <div class="n">${d.count}</div>
      <div class="bar ${d.count === 0 ? 'zero' : ''}" style="height:${Math.round(d.count / max * 62) + 4}%"></div>
      <div class="d">${esc(d.date.slice(5))}</div>
    </div>`).join('');

  // 最新入库：一行一篇，点整行进详情（与列表页行为一致）。
  // order=desc 是按**入库时间**排，不是发布时间 —— 概览要看的是"我刚收了什么"。
  const latestRows = (latest.items || []).map(a => `
    <div class="li" data-act="detail" data-id="${attr(a.id)}">
      <span class="ti">${esc(a.title)}</span>
      ${catBadge(a.category)}
      <span class="dt">${esc(String(a.collected_at || '').slice(5, 10))}</span>
    </div>`).join('');

  const idx = s.index || {};

  // 占用构成。**单位统一成 MB**：混着 KB/MB 没法横向比长度，而这条状图的全部意义
  // 就是比长度。各部分按占比分色块，宽度即占比。
  const sz = s.size || {};
  const usage = [
    { k: '配图', v: sz.media || 0, c: 'var(--c3)' },
    { k: '数据库', v: sz.db || 0, c: 'var(--c0)' },
    { k: '原文', v: sz.raw || 0, c: 'var(--c1)' },
  ].filter(u => u.v > 0);
  const usageTotal = sz.total || usage.reduce((a, u) => a + u.v, 0) || 1;
  const pctOf = v => (v / usageTotal * 100);
  const usageBar = usage.map(u =>
    `<i style="width:${pctOf(u.v).toFixed(2)}%;background:${u.c}"
        title="${esc(u.k)} ${toMB(u.v)}"></i>`).join('');
  const usageLegend = usage.map(u =>
    `<span><i class="sw" style="background:${u.c}"></i>${esc(u.k)}
       <b>${toMB(u.v)}</b><em>${pctOf(u.v).toFixed(1)}%</em></span>`).join('');
  box.innerHTML = `
    <div class="sec-head">
      <h2>库体量</h2>
      <span class="sub">本地 SQLite · 原文与配图全部落盘</span>
      <div class="spacer"></div>
      <button class="btn" data-act="refresh-stats">
        <svg class="ico" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5"/></svg>刷新
      </button>
    </div>

    <div class="cards">
      ${state.cats.map(cat => `
        <button class="card" data-act="tab" data-view="cat-${attr(cat.key)}">
          <div class="k">${esc(cat.name)} · ${esc(cat.prefix)}</div>
          <div class="v" style="color:var(--c${catIndex(cat.key)})">${c[cat.key] || 0}</div>
          <div class="foot">${esc(catFoot(cat))}</div></button>`).join('')}
      <button class="card ${s.review_pending ? 'c-warn' : ''}" data-act="tab" data-view="review">
        <div class="k">待复核</div><div class="v">${s.review_pending || 0}</div>
        <div class="foot">判类待确认 / 复评到期</div></button>
    </div>

    <div class="dash2">
      <div class="panel panel-pad">
        <div class="sec-head" style="margin-bottom:4px">
          <h2>近 7 日入库</h2>
          <span class="sub">合计 ${s.last7_total || 0} 条</span>
        </div>
        <div class="trend">${trend || '<div class="muted">暂无数据</div>'}</div>
      </div>

      <div class="panel panel-pad">
        <div class="sec-head" style="margin-bottom:10px"><h2>索引与占用</h2></div>
        <div class="kvgrid">
          <div class="k">分段总数</div><div class="v">${s.chunks || 0} 段（含每篇元数据段）</div>
          <div class="k">概念数</div><div class="v">${s.concepts || 0} 个</div>
          <div class="k">词法矩阵</div><div class="v">${idx.sparse_rows || 0} × ${idx.sparse_cols || 0}，非零 ${idx.sparse_nnz || 0}</div>
          <div class="k">占用合计</div><div class="v">${toMB(sz.total)}</div>
        </div>
        <div class="usage">${usageBar}</div>
        <div class="legend">${usageLegend}</div>
      </div>
    </div>

    <div class="panel panel-pad">
      <div class="sec-head" style="margin-bottom:6px">
        <h2>最新入库</h2>
        <div class="spacer"></div>
        <button class="btn" data-act="all-articles">
          <svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>全部文章
        </button>
      </div>
      <div class="latest">${latestRows || '<div class="muted">暂无</div>'}</div>
    </div>`;
  $('#tabReview').hidden = !s.review_pending;
  if (s.review_pending) $('#tabReview').textContent = s.review_pending;
}

/* ================================================================ 模块 3：待复核队列 */
async function renderReview(reset){
  const box = $('#view-review');
  if (reset !== false){ box.innerHTML = `<div class="empty">加载中…</div>`; }

  let r;
  try { r = await apiGet('/api/articles?queue=review&page_size=50&page=1' + orderArg()); }
  catch(e){ box.innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`; return; }

  const items = r.items || [];
  const rows = items.map(a => {
    const flag = a.review_flag === 1;
    const overdue = a.review_due && new Date(a.review_due) <= new Date();
    return `
    <div class="row">
      <div class="grow">
        <div class="t">${esc(a.title)}</div>
        <div class="m">
          ${catBadge(a.category)}
          ${flag ? '<span class="bdg warn">判类待确认</span>' : ''}
          ${(!flag && overdue) ? '<span class="bdg warn">复评到期</span>' : ''}
          <span>${esc(a.source || '来源未知')}</span>
          <span>${esc(d10(a.published_at || a.collected_at))}</span>
          <span class="muted">${esc(a.id)}</span>
          ${a.review_due ? `<span class="muted">复评 ${esc(d10(a.review_due))}</span>` : ''}
        </div>
        ${a.summary ? `<div class="s">${esc(a.summary)}</div>` : ''}
      </div>
      <div class="acts">
        <button class="btn tiny primary" data-act="confirm-review" data-id="${attr(a.id)}"
          title="判断没问题，放行（复评周期会自动顺延）">确认无误</button>
        <span class="muted" style="font-size:12px">改为</span>
        ${state.cats.filter(c => c.key !== a.category).map(c =>
          `<button class="btn tiny" data-act="setcat" data-id="${attr(a.id)}" data-cat="${attr(c.key)}"
             title="判据：${attr(c.criteria || '（这一类没写判据）')}">${esc(c.name)}</button>`).join('')}
        <button class="btn tiny" data-act="detail" data-id="${attr(a.id)}">详情</button>
      </div>
    </div>`;
  }).join('');

  // 判类标准速查：复核时必须能对照判据，否则只能靠感觉猜
  const critPanel = `
    <details class="spare" style="margin-bottom:12px">
      <summary>判类标准（拿不准时对照这里，判据可在「分类设置」里改）</summary>
      <div class="inner">
        <div class="repo-key">
          ${state.cats.map(c => `
            <div class="k">${esc(c.name)}${c.is_default ? ' <span class="muted">· 默认</span>' : ''}</div>
            <div class="v">${esc(c.criteria || '（这一类还没写判据）')}</div>`).join('')}
        </div>
      </div>
    </details>`;

  box.innerHTML = `
    <div class="sec-head">
      <h2>待复核队列</h2>
      <span class="sub">review_flag = 1 或 review_due 已到期 · 改类后自动清除标记</span>
      <div class="spacer"></div>
      ${orderSwitch()}
      <button class="btn" data-act="reload-review">
        <svg class="ico" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5"/></svg>刷新
      </button>
    </div>
    ${critPanel}
    <div class="panel">${items.length ? `<div class="rows">${rows}</div>` :
      `<div class="empty">队列已清空 —— 没有待复核条目</div>`}</div>`;
}

}

/* ================================================================ 分类设置（PRD §5.5） */
/* 开源分发时各人需要的分类不同：名字、数量、划分标准、检索方式都在这里改。

        </div>
        <div class="row2">
          <div class="field"><label>检索方式</label>
            <select class="sel" data-f="retrieval">
              ${modes.map(m => `<option value="${attr(m.key)}"${m.key === c.retrieval ? ' selected' : ''}>${esc(m.name)}</option>`).join('')}

          <div class="field"><label>展示样式</label>
            <select class="sel" data-f="display">
              ${state.displayModes.map(m => `<option value="${attr(m.key)}"${m.key === (c.display || '') ? ' selected' : ''}>${esc(m.name)}</option>`).join('')}

              <input type="checkbox" data-f="feature" value="${attr(f.key)}"${(c.features || []).includes(f.key) ? ' checked' : ''}>${esc(f.name)}</label>`).join('')}
            <label style="display:flex;gap:6px;align-items:center;font-size:13px">
              <input type="radio" name="defcat" data-act="set-default" data-cat="${attr(c.key)}"${c.is_default ? ' checked' : ''}>判不准时落这一类</label>
          </div>
        </div>
        <div class="field"><label>划分标准（写给人看，也给 Agent 判类看）</label>
          <textarea class="ta" style="min-height:96px" data-f="criteria">${esc(c.criteria || '')}</textarea></div>
        <div class="field"><label>收录原则（你判断「值不值得」的标准，注入 Agent）</label>
          <textarea class="ta" style="min-height:120px" data-f="principles"
            placeholder="例：「建议试试」= 有正式 release + 三个月内有提交 + 能自托管跑起来；缺一项即「建议观望」">${esc(c.principles || '')}</textarea>
          <div class="muted" style="font-size:12.5px;margin-top:5px">

        <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
          <button class="btn primary" data-act="save-cat" data-cat="${attr(c.key)}">保存</button>
          <span class="muted" style="font-size:12.5px">改前缀不动已有编号；改检索方式只影响之后入库的文章</span>

  box.innerHTML = `

      <div class="spacer"></div>
      <button class="btn" data-act="reload-settings">

      </button>
    </div>
    <div class="banner tip">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8.2v.3"/></svg>
      <div>改的是<b>你这份部署</b>的分类（当前 ${state.cats.length} 个：名字、数量、划分标准都能改，改完点保存）。
      「直接全文」= 不建向量索引（省算力）：这类文章按时间浏览、点开读全文，
      检索时只按标题 / 摘要 / 标签做关键词兜底。<b>检索方式只影响之后入库的文章</b>，

          <div class="field"><label>检索方式</label>
            <select class="sel" id="ncRetrieval">
              ${modes.map(m => `<option value="${attr(m.key)}">${esc(m.name)}</option>`).join('')}
            </select></div>
        </div>
        <div class="field"><label>能力项</label>
          <div style="display:flex;gap:14px;flex-wrap:wrap">
            ${feats.map(f => `<label style="display:flex;gap:6px;align-items:center;font-size:13px">

        <div class="field"><label>划分标准</label>
          <textarea class="ta" id="ncCriteria" style="min-height:80px" placeholder="什么样的内容该归到这一类"></textarea></div>
        <div class="field"><label>收录原则（可选）</label>
          <textarea class="ta" id="ncPrinciples" style="min-height:100px" placeholder="我看重什么、什么算值得试、核查时优先回答什么"></textarea></div>
        <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
          <button class="btn primary" data-act="add-cat">新增</button>
