<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>标签词云</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --ink:#1a1e23; --dim:#666e78;
    --faint:#98a0a8; --accent:#2563eb;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 22px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  h1{margin:0;font-size:17px}
  .meta{color:var(--dim);font-size:12.5px}
  .meta b{color:var(--ink)}
  .ctl{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  button.sel{border:1px solid var(--line);background:var(--card);border-radius:7px;
    padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--dim)}
  button.sel.on{border-color:var(--accent);color:var(--accent);background:#eef2ff}
  input[type=text]{padding:6px 10px;border:1px solid var(--line);border-radius:7px;
    font-size:13px;width:180px}
  .wrap{display:flex;align-items:flex-start}
  #cloudBox{flex:1;min-width:0;padding:16px 20px 40px}
  canvas{width:100%;height:660px;display:block;cursor:pointer}
  aside{width:340px;flex:0 0 340px;height:calc(100vh - 53px);overflow-y:auto;
    border-left:1px solid var(--line);background:var(--card);padding:16px 18px 40px}
  .hint{font-size:12.5px;color:var(--dim);margin:0 0 12px;max-width:980px}
  aside h2{font-size:16px;margin:0 0 4px}
  aside .sub{font-size:12px;color:var(--faint);margin-bottom:12px}
  .badge{display:inline-block;font-size:11px;border-radius:4px;padding:1px 6px;
    margin-right:5px;color:#fff}
  .ai{padding:9px 0;border-bottom:1px solid #f2f4f6}
  .ai:last-child{border-bottom:none}
  .ai .t{font-size:13px;font-weight:500}
  .ai .m{font-size:11.5px;color:var(--faint);margin-top:2px}
  .lgd{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--dim);margin-top:8px}
  .lgd i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;
    vertical-align:-1px}
</style>
</head>
<body>
<header>
  <h1>标签词云</h1>
  <div class="meta" id="meta"></div>
  <div class="ctl">
    <input type="text" id="q" placeholder="找标签（Agent、RAG…）">
    <span id="catBtns"></span>
    <span id="sizeBtns"></span>
  </div>
</header>
<div class="wrap">
  <div id="cloudBox">
    <p class="hint" id="hint"></p>
    <canvas id="cv"></canvas>
    <div class="lgd" id="lgd"></div>
  </div>
  <aside id="side">
    <p class="hint">点云里任意一个词，这里会列出带这个标签的全部文章。</p>
  </aside>
</div>
<script>
const P = /*__DATA__*/null;
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CC = {idea:"#2563eb", tech:"#0f766e", app:"#b45309",
            dao:"#7c3aed", health:"#dc2626"};
const CATN = P.categories || {};
let cat = "", q = "", N = 120;

const TAGS = P.tags.filter(t => t.n >= 2);   // 只出现 1 次的不进云，否则全是碎字
const ONCE = P.tags.length - TAGS.length;

document.getElementById("meta").innerHTML =
  `<b>${P.total_tags}</b> 个标签 / <b>${P.total_articles}</b> 篇 · ` +
  `前 <b>${P.tags_for_90}</b> 个标签就覆盖了 90% 的文章`;

document.getElementById("hint").innerHTML =
  `词的<b>大小 = 文章数</b>，<b>颜色 = 该标签下文章的主导分类</b>（图例在下方）。` +
  `只画出现 ≥2 次的标签，一次性标签 ${ONCE} 个没画。` +
  `注意同义标签会并排出现 —— 那正是标签碎片化的直观样子` +
  `（<b>Agent</b> / <b>AI Agent</b> / <b>智能体</b> 三个词，指的是同一件事）。`;

document.getElementById("lgd").innerHTML =
  Object.keys(CATN).map(k => `<span><i style="background:${CC[k]||"#94a3b8"}"></i>${esc(CATN[k])}</span>`).join("");

document.getElementById("catBtns").innerHTML =
  `<button class="sel on" data-c="">全部</button>` +
  Object.keys(CATN).map(k => `<button class="sel" data-c="${esc(k)}">${esc(CATN[k])}</button>`).join("");
document.getElementById("sizeBtns").innerHTML =
  [80, 150, 300].map(n => `<button class="sel ${n===N?"on":""}" data-n="${n}">${n} 词</button>`).join("");
document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
  cat = b.dataset.c;
  document.querySelectorAll("[data-c]").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); draw();
});
document.querySelectorAll("[data-n]").forEach(b => b.onclick = () => {
  N = +b.dataset.n;
  document.querySelectorAll("[data-n]").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); draw();
});
document.getElementById("q").addEventListener("input", e => { q = e.target.value.trim(); draw(); });

function pool(){
  const qq = q.toLowerCase();
  return TAGS.filter(t => (!cat || (t.c[cat]||0) > 0)
      && (!qq || t.t.toLowerCase().includes(qq)))
    .sort((a,b) => b.n - a.n || a.t.localeCompare(b.t));
}
function dominant(t){
  const e = Object.entries(t.c).sort((a,b)=>b[1]-a[1])[0];
  return e ? e[0] : "idea";
}
function sizeOf(n, max){
  const lo = 12, hi = 46;
  const r = Math.sqrt(n / max);
  return Math.round(lo + (hi - lo) * Math.max(0, Math.min(1, (r - 0.15) / 0.85)));
}
function overlap(a, b){
  return !(a.x + a.w < b.x || b.x + b.w < a.x || a.y + a.h < b.y || b.y + b.h < a.y);
}
let placed = [];
function draw(){
  const cv = document.getElementById("cv");
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = 660;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.textBaseline = "top";
  placed = [];
  const list = pool().slice(0, N);
  if (!list.length) {
    ctx.fillStyle = "#98a0a8"; ctx.font = "14px sans-serif";
    ctx.fillText("没有匹配的标签", 20, 30); return;
  }
  const max = list[0].n;
  for (const t of list) {
    const fs = sizeOf(t.n, max);
    ctx.font = `600 ${fs}px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif`;
    const w = ctx.measureText(t.t).width + 8, h = fs * 1.16;
    let box = null;
    outer:
    for (let ring = 0; ring < Math.max(W, H); ring += 5) {
      for (let a = 0; a < 360; a += 5) {
        const rad = a * Math.PI / 180;
        const x = W/2 + ring * Math.cos(rad) - w/2;
        const y = H/2 + ring * Math.sin(rad) * 0.62 - h/2;
        if (x < 2 || y < 2 || x + w > W-2 || y + h > H-2) continue;
        const b = {x, y, w, h};
        let free = true;
        for (const p of placed) if (overlap(p, b)) { free = false; break; }
        if (free) { box = b; break outer; }
      }
    }
    if (!box) continue;
    box.tag = t; placed.push(box);
    ctx.fillStyle = CC[dominant(t)] || "#475569";
    ctx.globalAlpha = 0.80 + 0.20 * (t.n / max);
    ctx.fillText(t.t, box.x + 4, box.y);
  }
  ctx.globalAlpha = 1;
}
function showTag(t){
  const dist = Object.entries(t.c).sort((a,b)=>b[1]-a[1])
    .map(([k,v]) => `<span class="badge" style="background:${CC[k]||"#64748b"}">${esc(CATN[k]||k)} ${v}</span>`).join(" ");
  const arts = t.ids.map(id => P.articles[id]).filter(Boolean)
    .sort((a,b) => String(b.d).localeCompare(String(a.d)));
  document.getElementById("side").innerHTML =
    `<h2>${esc(t.t)}</h2><div class="sub">${t.n} 篇 · ${dist}</div>` +
    arts.map(a => `<div class="ai"><div class="t">${esc(a.t)}</div>
      <div class="m">${esc(a.d)} · ${esc(CATN[a.c]||a.c)}</div></div>`).join("");
}
document.getElementById("cv").addEventListener("click", ev => {
  const r = ev.currentTarget.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const hit = placed.find(p => mx >= p.x && mx <= p.x+p.w && my >= p.y && my <= p.y+p.h);
  if (hit) showTag(hit.tag);
});
document.getElementById("cv").addEventListener("mousemove", ev => {
  const r = ev.currentTarget.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const hit = placed.find(p => mx >= p.x && mx <= p.x+p.w && my >= p.y && my <= p.y+p.h);
  ev.currentTarget.style.cursor = hit ? "pointer" : "default";
  ev.currentTarget.title = hit ? `${hit.tag.t} · ${hit.tag.n} 篇` : "";
});
draw();
window.addEventListener("resize", draw);
</script>
</body>
</html>
