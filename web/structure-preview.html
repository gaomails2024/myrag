<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识结构 · 三档草案</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --ink:#1b1f24; --dim:#6b7280;
    --faint:#9aa1a9; --accent:#2563eb; --opposed:#dc2626; --related:#64748b;
    --depends:#0f766e; --warn:#b45309;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  header{background:var(--card);border-bottom:1px solid var(--line);
    padding:26px 32px 0;position:sticky;top:0;z-index:10}
  h1{margin:0 0 6px;font-size:21px;letter-spacing:.3px}
  .meta{color:var(--dim);font-size:13px;margin-bottom:16px}
  .meta b{color:var(--ink);font-weight:600}
  .note{margin-top:10px;padding:10px 12px;background:#f8fafc;border:1px solid var(--line);
    border-radius:8px;font-size:12.5px;color:#4b5563;max-width:980px;line-height:1.65}
  .note b{color:var(--ink)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:0}
  .tab{border:1px solid var(--line);background:#fbfbfc;border-radius:8px 8px 0 0;
    padding:10px 16px;cursor:pointer;font-size:14px;color:var(--dim);
    border-bottom:none;transition:.15s}
  .tab:hover{background:#f3f4f6}
  .tab.on{background:var(--bg);color:var(--ink);font-weight:600;
    box-shadow:inset 0 -3px 0 var(--accent);border-color:var(--line)}
  .tab .k{font-size:12px;color:var(--faint);margin-left:6px}
  main{padding:24px 32px 60px;max-width:1560px}
  .hint{color:var(--warn);background:#fffbeb;border:1px solid #fde68a;
    border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:20px}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
    align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .card h3{margin:0 0 2px;font-size:16px;line-height:1.45}
  .card h3.none{color:var(--faint);font-weight:500;font-style:italic}
  .cnt{font-size:12px;color:var(--dim);margin-bottom:8px}
  .cnt b{color:var(--accent);font-size:13px}
  .desc{font-size:13px;color:#374151;margin:0 0 10px}
  .kw{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .kw span{font-size:11.5px;background:#f1f5f9;color:#475569;border-radius:5px;
    padding:2px 7px}
  .bar{display:flex;height:5px;border-radius:3px;overflow:hidden;
    background:#f1f5f9;margin-bottom:6px}
  .bar i{display:block;height:100%}
  .cats{font-size:11.5px;color:var(--faint);margin-bottom:8px}
  details{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
  summary{cursor:pointer;font-size:12.5px;color:var(--accent);outline:none}
  ol{margin:10px 0 0;padding-left:0;list-style:none}
  ol li{padding:7px 0;border-bottom:1px solid #f3f4f6;font-size:13px}
  ol li:last-child{border-bottom:none}
  .t{font-weight:500}
  .m{color:var(--faint);font-size:11.5px;margin-top:2px}
  .s{color:#4b5563;font-size:12.5px;margin-top:3px}
  .links{margin-top:36px}
  .links h2{font-size:16px;margin:0 0 4px}
  .links .sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
  .link{display:flex;gap:12px;padding:10px 14px;background:var(--card);
    border:1px solid var(--line);border-radius:8px;margin-bottom:8px;font-size:13px}
  .link .kind{flex:0 0 62px;font-size:11.5px;font-weight:600;padding:2px 0}
  .link.opposed .kind{color:var(--opposed)}
  .link.related .kind{color:var(--related)}
  .link.depends .kind{color:var(--depends)}
  .link .pair{font-weight:600;flex:0 0 auto}
  .link .note{color:var(--dim)}
  .none-box{color:var(--faint);font-size:13px;padding:14px 0}
</style>
</head>
<body>
<header>
  <h1>知识结构 · 三档草案</h1>
  <div class="meta" id="meta"></div>
  <div class="tabs" id="tabs"></div>
</header>
<main>
  <div id="hint"></div>
  <div class="grid" id="grid"></div>
  <div class="links">
    <h2>主题之间的关系</h2>
    <div class="sub">对立关系是你明确要的：相反观点都留着，是为了以后能对照着看。</div>
    <div id="links"></div>
  </div>
</main>
<script>
const D = /*__DATA__*/null;
const P = D.payload, N = D.names || {};
const LEVELS = Object.keys(P.levels);

const CATCOLOR = {idea:"#2563eb", tech:"#0f766e", app:"#b45309",
                  dao:"#7c3aed", health:"#dc2626"};
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.getElementById("meta").innerHTML =
  `全库 <b>${P.n_articles}</b> 篇 · 聚类方式 <b>${esc(P.method)}</b> · ` +
  `建于 <b>${esc(P.built_at)}</b> · 向量 <b>${esc(P.model_id)}</b>` +
  (D.brief ? " · <b>未命名</b>版（只看粒度）" : "") +
  `<div class="note"><b>两个数字怎么读</b>：「紧凑度」是轮廓系数（簇内多紧 vs 簇间多散），
   「成员保持率」是换随机种子重跑后还认得同一伙的比例。它们<b>天然偏低</b>——
   因为你的主题是连续谱（战略↔AI↔组织互相渗透），不是界限清楚的抽屉。
   所以别拿它们当质量结论，<b>真正的判据是下面的语义可读性</b>：主题名与代表篇对不对得上、
   看完能不能帮你想起库里有啥。</div>`;

document.getElementById("tabs").append(...LEVELS.map(k => {
  const lv = P.levels[k], b = document.createElement("button");
  b.className = "tab"; b.dataset.k = k;
  b.innerHTML = `${esc(k)} 簇<span class="k">实际 ${lv.n_clusters} · 紧凑度 ${lv.silhouette} · 成员保持率 ${lv.stability}</span>`;
  b.onclick = () => show(k);
  return b;
}));

function card(c){
  const n = N[c.key];
  const name = n && n.name ? n.name : null;
  const kws = (n && n.keywords && n.keywords.length) ? n.keywords : c.keywords;
  const total = Object.values(c.categories).reduce((a,b)=>a+b,0) || 1;
  const bar = Object.entries(c.categories).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
    `<i style="width:${(v/total*100).toFixed(1)}%;background:${CATCOLOR[k]||"#94a3b8"}"></i>`).join("");
  const cats = Object.entries(c.categories).sort((a,b)=>b[1]-a[1])
    .map(([k,v])=>`${esc((P.categories||{})[k]||k)} ${v}`).join(" · ");
  const arts = c.top_articles.map(a=>`<li>
      <div class="t">${esc(a.title)}</div>
      <div class="m">${esc(a.id)} · ${esc(a.date)} · ${esc((P.categories||{})[a.category]||a.category)} · 相似度 ${a.sim}</div>
      ${a.summary?`<div class="s">${esc(a.summary)}</div>`:""}
    </li>`).join("");
  return `<div class="card">
    <h3 class="${name?"":"none"}">${name?esc(name):"（待命名 "+esc(c.key)+"）"}</h3>
    <div class="cnt"><b>${c.size}</b> 篇 · 平均相似度 ${c.sim_mean}</div>
    ${(n&&n.summary)?`<p class="desc">${esc(n.summary)}</p>`:""}
    <div class="kw">${kws.slice(0,10).map(w=>`<span>${esc(w)}</span>`).join("")}</div>
    <div class="bar">${bar}</div>
    <div class="cats">${cats}</div>
    <details><summary>代表篇（按与主题中心的相似度排序）</summary>
      <ol>${arts}</ol></details>
  </div>`;
}

function linksFor(k){
  const inLevel = s => String(s||"").indexOf("k"+k+"-") === 0;
  return (N.links||[]).filter(l => inLevel(l.a) && inLevel(l.b));
}

function show(k){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.dataset.k===k));
  const lv = P.levels[k];
  document.getElementById("hint").innerHTML = lv.n_clusters == Number(k)
    ? ""
    : `<div class="hint">这档实际切出 <b>${lv.n_clusters}</b> 个簇（目标 ${k}）。
       层次聚类只合并不分裂，凑不出恰好整数个 —— 这是客观结果，不强行凑。</div>`;
  document.getElementById("grid").innerHTML = lv.clusters.map(card).join("");
  const ls = linksFor(k);
  document.getElementById("links").innerHTML = ls.length
    ? ls.map(l=>`<div class="link ${esc(l.kind)}">
        <span class="kind">${esc({related:"相关",opposed:"对立",depends:"依赖"}[l.kind]||l.kind)}</span>
        <span class="pair">${esc((N[l.a]||{}).name||l.a)} ↔ ${esc((N[l.b]||{}).name||l.b)}</span>
        <span class="note">${esc(l.note||"")}</span></div>`).join("")
    : `<div class="none-box">这一档还没有标注主题关系。</div>`;
  window.scrollTo({top:0});
}
show(LEVELS[Math.min(1, LEVELS.length-1)]);
</script>
</body>
</html>
