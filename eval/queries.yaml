# ================================================================
# MyRag 检索评测集（PRD §8.5）
#
# 构造纪律（做错了后面全白费）：
#   1. query 必须是「人会怎么问」——口语化、不记得确切标题也能问出口。
#      ✗ 反例：「原子习惯」        （这是标题改写，只测关键词匹配）
#      ✓ 正例：想养成习惯有什么办法   （这才是真实提问）
#   2. relevant 只列「真正回答了这个问题」的文章。
#      拿不准的一律不列 —— 标注放松会让所有分数虚高，比不评测更糟。
#      宁可漏标（Recall 虚低、能通过补标注修）也不要虚高（看不出真问题）。
#   3. 一条 query 可以对应多篇；但不要为了凑命中数而放宽标准。
#   4. **无答案 query**（`relevant: []` + `expect_absent: true`）：
#      库里确实没有能回答它的内容。这类**不计入 Recall/MRR 聚合**，
#      单独统计「top-1 分数」与「有答案 query 的差距」—— 用来回答一个
#      聚合指标答不了的问题：**没答案时，它会不会硬凑一堆不相干的给你**。
#
# 规模：v1 是 10 条（全是「恰好 1 篇相关」，Recall@1 容易满分、没有区分度）。
#       v2 扩到 25 条，补两类 v1 完全没覆盖的：多篇相关、无答案。
#       v3 扩到 37 条，再补：主题簇（经营/财务/知识库）、极短 query、跨语言对照，
#          以及一组「同领域有/无答案」的对照题（q24 问 ASR 无答案 vs q37 问 OCR 有答案）。
# ================================================================

