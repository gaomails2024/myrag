# ----------------------------------------------------------------
# 待你确认/补充的三件事：
#
#   1. 问法像不像人话？特别是有没有哪条其实是你「记得标题才问得出来」的
#      —— 那种条目测的是关键词匹配，不是检索能力，应该换掉。
#   2. relevant 有没有漏？比如某条你印象里「应该还有别的文章也讲了」，
#      但没被列进来。漏标会让 Recall 虚低。
#   3. 有没有你「确实想搜、但库里没有」的问题？那类应单独建一组
#      「无答案 query」，用来测会不会硬凑结果（现在先不做）。
